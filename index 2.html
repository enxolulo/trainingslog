<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#f4f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}img{max-width:100%}</style>
<title>Trainingslog</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: eine Spalte, Kopfzeile mit Rang, Tableiste unten wie in einer App. Scoreboard-Typografie, ruhiger Teal-Akzent; Ränge tragen eigene Metallfarben. */
:root{
  --bg:#f4f5f4;
  --surface:#ffffff;
  --surface-2:#eceeed;
  --line:#d6dad8;
  --fg:#1b2220;
  --fg-dim:#5f6b68;
  --accent:#0c7a6c;
  --accent-ink:#ffffff;
  --warn:#b4651a;
  --boss:#b3263b;
  --boss-bg:#fbeef0;
  --m-base:#c9d0cd;
  --m-sil:#e6e9e8;
  --h1:#aedcd2;
  --h2:#7fc6b7;
  --h3:#3fa48f;
  --h4:#0c7a6c;
  --r0:#6b7673;
  --r1:#9a6234;
  --r2:#0c7a6c;
  --r3:#2f62b8;
  --r4:#6c45b5;
  --r5:#a67c00;
  --r6:#b3263b;
  --r7:#1b2220;
  --radius:14px;
  --f-disp:'Barlow Condensed','Helvetica Neue',Arial,sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715;
  --surface:#1a211f;
  --surface-2:#222b28;
  --line:#2f3a37;
  --fg:#e8eeec;
  --fg-dim:#94a39f;
  --accent:#34b39e;
  --accent-ink:#06211c;
  --warn:#e09a4f;
  --boss:#f0647a;
  --boss-bg:#2a181c;
  --m-base:#3a4743;
  --m-sil:#252e2b;
  --h1:#2b5a52;
  --h2:#2f7b6e;
  --h3:#33a18c;
  --h4:#58dcc4;
  --r0:#9aa8a4;
  --r1:#c98a55;
  --r2:#34b39e;
  --r3:#6c9cf0;
  --r4:#a587ee;
  --r5:#e6bd3c;
  --r6:#f0647a;
  --r7:#f2f6f5;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121715;
  --surface:#1a211f;
  --surface-2:#222b28;
  --line:#2f3a37;
  --fg:#e8eeec;
  --fg-dim:#94a39f;
  --accent:#34b39e;
  --accent-ink:#06211c;
  --warn:#e09a4f;
  --boss:#f0647a;
  --boss-bg:#2a181c;
  --m-base:#3a4743;
  --m-sil:#252e2b;
  --h1:#2b5a52;
  --h2:#2f7b6e;
  --h3:#33a18c;
  --h4:#58dcc4;
  --r0:#9aa8a4;
  --r1:#c98a55;
  --r2:#34b39e;
  --r3:#6c9cf0;
  --r4:#a587ee;
  --r5:#e6bd3c;
  --r6:#f0647a;
  --r7:#f2f6f5;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance;font-weight:600}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;max-width:560px;margin:0 auto}
.bar h1{font-size:22px;letter-spacing:.06em}
.bar .day{font-size:12px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-disp)}
#hdr{margin-left:auto;display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0 2px 6px;font-family:var(--f-disp);font-size:16px;letter-spacing:.06em;text-transform:uppercase}

main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.card>h2{font-size:15px;color:var(--fg-dim);letter-spacing:.09em;margin-bottom:10px}
.eyebrow{font-family:var(--f-disp);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-dim)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar>div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabbar button{position:relative;background:none;border:0;border-top:2px solid transparent;padding:12px 2px 11px;font-family:var(--f-disp);font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-dim)}
.tabbar button[aria-selected="true"]{color:var(--fg);border-top-color:var(--accent)}
.tabbar button.alert::after{content:"";position:absolute;top:8px;right:calc(50% - 26px);width:7px;height:7px;border-radius:50%;background:var(--boss)}

.today-title{font-family:var(--f-disp);font-size:28px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin:2px 0 2px}
.today-sub{color:var(--fg-dim);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:18px;letter-spacing:.07em;text-transform:uppercase;padding:13px;margin-top:12px;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font-size:15px;padding:10px}
.btn.small{width:auto;padding:7px 12px;font-size:14px;margin-top:0}
.btn.danger{background:var(--boss);color:var(--surface)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 2px 6px;text-align:center;min-width:0}
.seg button b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1;font-weight:600}
.seg.three button b{font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.seg button span{display:block;font-size:11px;color:var(--fg-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sug{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}

ul.ex{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
ul.ex li{background:var(--surface-2);display:flex;align-items:stretch;border-radius:3px;overflow:hidden}
ul.ex li:first-child{border-radius:9px 9px 3px 3px}
ul.ex li:last-child{border-radius:3px 3px 9px 9px}
ul.ex li.fin .ex-main{opacity:.5}
.ex-main{flex:1;min-width:0;background:none;border:0;padding:9px 6px 9px 11px;display:flex;gap:10px;align-items:flex-start;text-align:left}
.ex-i{font-family:var(--f-disp);font-size:15px;color:var(--fg-dim);min-width:14px;padding-top:1px}
.ex-b{flex:1;min-width:0}
.ex-n{display:block;font-weight:500;line-height:1.3}
.ex-m{display:block;font-size:13px;color:var(--fg-dim);margin-top:1px}
.ex-h{display:block;font-size:12.5px;color:var(--fg-dim);line-height:1.35;margin-top:2px}
.chip{display:inline-block;font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 8px;margin-top:5px}
.ex-t{flex:none;width:62px;background:none;border:0;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px}
.ex-t b{font-family:var(--f-disp);font-size:20px;line-height:1;font-weight:600}
.ex-t span{font-family:var(--f-disp);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}

#timer{position:fixed;left:12px;right:12px;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:31;max-width:536px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px}
#timer.done{background:var(--accent);color:var(--accent-ink)}
#timer .tl{flex:1;min-width:0;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer .tl small{display:block;font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
#timer .tt{font-family:var(--f-disp);font-size:30px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
#timer button{background:none;border:1px solid currentColor;border-radius:9px;padding:5px 9px;font-family:var(--f-disp);font-size:14px;letter-spacing:.05em;opacity:.9}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.week .dn{text-align:center;font-family:var(--f-disp);font-size:12px;letter-spacing:.04em;color:var(--fg-dim)}
.week .cell{height:42px;width:100%;padding:0;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg);border:1px solid transparent;min-width:0}
.week .cell b{font-family:var(--f-disp);font-size:16px;line-height:1.1;font-weight:600}
.week .cell span{font-size:10.5px;line-height:1.1}
.week .cell.on{background:var(--accent);color:var(--accent-ink)}
.week .cell.run{border-color:var(--accent);color:var(--accent)}
.week .cell.today{box-shadow:inset 0 0 0 2px var(--fg-dim)}
.week .cell:disabled{opacity:.45;cursor:default}
.week.month .cell{height:50px;justify-content:flex-start;padding-top:3px;gap:1px}
.week.month .cell i{font-style:normal;font-size:10.5px;line-height:1;opacity:.75;font-variant-numeric:tabular-nums}
.week.month .cell.out{visibility:hidden}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{flex:1;text-align:center;font-size:18px;color:var(--fg)}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.entry span{min-width:0}

.rankrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left}
.rankrow .rt{flex:1;min-width:0}
.rankrow .rn{font-family:var(--f-disp);font-size:21px;line-height:1.1;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.xpbar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hero{text-align:center}
.hero .rn{font-family:var(--f-disp);font-size:30px;line-height:1.05;letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-top:4px}
.emb text{font-family:var(--f-disp);font-weight:700}

.bosscard{background:var(--boss-bg);border:1px solid var(--boss);border-radius:var(--radius);padding:14px}
.bosscard .eyebrow{color:var(--boss)}
.bosscard .bn{font-family:var(--f-disp);font-size:26px;line-height:1.05;letter-spacing:.03em;text-transform:uppercase;font-weight:600;margin:2px 0 6px}
.part{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.part .pt{flex:1;min-width:0}
.part .pl{font-family:var(--f-disp);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim)}
.part.ok .pt{opacity:.55}
.tick{flex:none;font-family:var(--f-disp);font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding-top:2px}

.statrow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.statrow .sn{flex:1;min-width:0}
.statrow .sn small{display:block;color:var(--fg-dim);font-size:12.5px;line-height:1.35}
.statrow b{font-family:var(--f-disp);font-size:26px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-disp);font-size:13px;letter-spacing:.04em;color:var(--accent);min-width:74px;text-align:right}
.delta.zero{color:var(--fg-dim)}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophy{background:var(--surface-2);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.trophy b{display:block;font-family:var(--f-disp);font-size:14px;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;font-weight:600;margin-top:2px}
.trophy span{font-size:11px;color:var(--fg-dim)}
.trophy.unknown{opacity:.5}
.ladder{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.ladder.locked{opacity:.45}
.ladder .lt{flex:1;min-width:0}
.ladder .lt b{display:block;font-family:var(--f-disp);font-size:17px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;line-height:1.15}

.bodywrap{display:flex;gap:4px;justify-content:center;margin-top:4px}
.bodywrap figure{margin:0;flex:1;min-width:0;text-align:center}
.bodywrap figcaption{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);margin-top:2px}
svg.body{width:100%;height:auto;max-width:200px}
svg.body .sil{fill:var(--m-sil)}
svg.body .m{stroke:var(--surface);stroke-width:1.1;stroke-linejoin:round;transition:fill .25s;cursor:pointer}
svg.body .m.sel{stroke:var(--fg);stroke-width:1.5}
.pick{min-height:42px;margin-top:8px;padding:8px 11px;background:var(--surface-2);border-radius:10px;font-size:14px}
.pick b{font-family:var(--f-disp);font-size:16px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--fg-dim)}
.legend i{width:16px;height:10px;border-radius:3px;display:inline-block}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field{flex:1;min-width:84px}
label{display:block;font-family:var(--f-disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:70px;resize:vertical;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--surface-2);border-radius:10px;padding:9px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;line-height:1.25;margin-top:3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);font-family:var(--f-disp)}

.banner{background:var(--surface);border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:11px;padding:10px 12px;font-size:14px}
.banner b{font-family:var(--f-disp);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--warn)}
.banner .btn{margin-top:8px}
.banner.calm{border-color:var(--accent);border-left-color:var(--accent)}
.banner.calm b{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheet .inner{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:19px;margin-bottom:2px}
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 11px;margin-top:6px}
.opt.sel{border-color:var(--accent)}
.opt small{display:block;color:var(--fg-dim);font-size:12.5px}
.muted{color:var(--fg-dim);font-size:13px}
.hint{color:var(--fg-dim);font-size:13px;margin-top:8px}

#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:60;max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;text-align:center;white-space:pre-line}
#rankup{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
#rankup .eyebrow{font-size:15px;letter-spacing:.3em}
#rankup .rn{font-family:var(--f-disp);font-size:44px;line-height:1;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
#rankup .emb{animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
#rankup .btn{max-width:260px;margin-top:22px}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Trainingslog</h1>
    <span class="day num" id="todayLabel"></span>
    <button id="hdr" aria-label="Status öffnen"></button>
  </div>
</header>
<main id="view"></main>
<div id="timer" hidden>
  <div class="tl"><small>Pause</small><span id="tmL"></span></div>
  <div class="tt" id="tmT">0:00</div>
  <button id="tmP">+30 s</button>
  <button id="tmX" aria-label="Timer beenden">Stopp</button>
</div>
<nav class="tabbar"><div id="tabs" role="tablist">
  <button role="tab" data-t="heute" aria-selected="true">Heute</button>
  <button role="tab" data-t="plan" aria-selected="false">Plan</button>
  <button role="tab" data-t="status" aria-selected="false">Status</button>
  <button role="tab" data-t="verlauf" aria-selected="false">Verlauf</button>
  <button role="tab" data-t="mehr" aria-selected="false">Mehr</button>
</div></nav>
<div id="sheetHost"></div>
<div id="toast" hidden></div>
<div id="rankup" hidden></div>

<script>
const HOSTED=!!document.querySelector('link[rel="manifest"]');

/* ================= Plan ================= */
const M = {brust:'Brust',schulter:'Schultern',trizeps:'Trizeps',bizeps:'Bizeps',unterarm:'Unterarme',
 lat:'Latissimus',oberRuecken:'Oberer Rücken und Nacken',unterRuecken:'Unterer Rücken',bauch:'Bauch',
 gesaess:'Gesäß',quad:'Quadrizeps',hamstring:'Beinbeuger',waden:'Waden'};
const O=(n,m,l,h)=>({n,m,l,h});
const X=(id,sets,pause,p,opts)=>({id,sets,pause,p,opts});

const PLAN=[
{id:'A',name:'Oberkörper · vertikal',ex:[

const KEY='trainingslog-v1';
const DEF=()=>({ex:{},log:[],runs:[],weight:[],steps:[],bests:[],ev:[],lastDeload:null,lastTest:null,start:null,
 deload:null,pause:null,pauses:[],boss:{cur:null,next:null,done:[],fled:[]},exam:{cur:null,passed:0,failed:[]},
 goal:{s:4,r:2},live:null,lastBackup:null,seenLvl:1,v:2});
let S=migrate(load());

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return {};
}
function migrate(p){
  const d=DEF(),s=Object.assign({},d,p||{});
  s.boss=Object.assign({},d.boss,s.boss||{});s.exam=Object.assign({},d.exam,s.exam||{});s.goal=Object.assign({},d.goal,s.goal||{});
  ['log','runs','weight','steps','bests','ev','pauses'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  ['done','fled'].forEach(k=>{if(!Array.isArray(s.boss[k]))s.boss[k]=[];});
  if(!Array.isArray(s.exam.failed))s.exam.failed=[];
  const t0=s.start||today();
  /* Startwerte aus dem Gespräch: 10 Klimmzüge, 30 Liegestütze, 7 Dips, 15 Split Squats */
  Object.keys(BASE).forEach(k=>{if(!s.bests.some(b=>b.k===k))s.bests.unshift({date:t0,k,v:BASE[k],base:true});});
  /* Stufen, die schon vor dem Punktesystem erreicht waren, zählen rückwirkend */
  Object.keys(s.ex||{}).forEach(id=>{const st=s.ex[id];
    for(let l=1;l<=(st.lvl||0);l++)if(!s.ev.some(e=>e.t==='stage'&&e.ex===id&&e.opt===(st.opt||0)&&e.lvl===l))
      s.ev.push({date:st.since||t0,t:'stage',ex:id,opt:st.opt||0,lvl:l,xp:XP.stage});});
  s.v=2;return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function exState(id){if(!S.ex[id])S.ex[id]={opt:0,lvl:0,since:today()};return S.ex[id];}
function findEx(id){for(const s of PLAN)for(const e of s.ex)if(e.id===id)return e;return null;}
function curOpt(e){return e.opts[Math.min(exState(e.id).opt,e.opts.length-1)];}
function curLvl(e){const o=curOpt(e);return o.l[Math.min(exState(e.id).lvl,o.l.length-1)];}
function sessName(id){const p=PLAN.find(x=>x.id===id);return p?p.name:'';}

/* ================= Hilfen ================= */
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function today(){return iso(new Date());}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const[a,b,cc]=s.split('-').map(Number);return new Date(a,b-1,cc);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function addDays(ds,n){const d=parse(ds);d.setDate(d.getDate()+n);return iso(d);}
function fmtDate(s){const d=parse(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function dayName(s){return DAYS[(parse(s).getDay()+6)%7];}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
function weekKey(ds){return iso(mondayOf(parse(ds)));}
function ago(n){return n===null?'noch nie':n===0?'heute':n===1?'gestern':'vor '+n+' T';}
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;};
function parseTime(v){v=String(v).trim();if(!v)return null;if(v.includes(':')){const p=v.split(':');const a=num(p[0]),b=num(p[1]||0);return a===null?null:a+(b||0)/60;}return num(v);}
function fmtTime(min){let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return m+':'+String(s).padStart(2,'0');}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nf=n=>Math.round(n).toLocaleString('de-DE');
const $=s=>document.querySelector(s);
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}

/* ================= Abgeleitete Werte ================= */
function lastOf(id){let b=null;for(const l of S.log)if(l.s===id&&(!b||l.date>b))b=l.date;return b;}
function regionsNear(ds){const s=new Set();for(const l of S.log){const n=daysBetween(l.date,ds);if(n===0||n===1)s.add(REGION[l.s]);}return s;}
function suggest(){
  const order=PLAN.map((p,i)=>({p,i,d:lastOf(p.id)||''})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.i-b.i);
  const near=regionsNear(today());
  const free=order.find(o=>!near.has(REGION[o.p.id]));
  return (free||order[0]).p;
}
function lastTrained(mus){
  let best=null;
  for(const L of S.log){
    const sess=PLAN.find(p=>p.id===L.s);if(!sess)continue;
    for(const e of sess.ex){const st=S.ex[e.id];const o=e.opts[st?Math.min(st.opt,e.opts.length-1):0];
      if(o.m.includes(mus)){if(!best||L.date>best)best=L.date;}}
  }
  return best;
}
function heat(mus){const d=lastTrained(mus);if(!d)return null;const n=daysBetween(d,today());
  if(n<=1)return 4;if(n<=3)return 3;if(n<=5)return 2;if(n<=8)return 1;return 0;}
function curWeight(){if(!S.weight.length)return 96;return [...S.weight].sort((a,b)=>a.date<b.date?-1:1).pop().kg;}
function movAvg(arr,win){const out=[];for(let i=0;i<arr.length;i++){const from=parse(arr[i].date);let s=0,n=0;
  for(let j=0;j<=i;j++){if((from-parse(arr[j].date))/86400000<win){s+=arr[j].kg;n++;}}out.push({date:arr[i].date,kg:s/n});}return out;}

function paused(){return !!S.pause;}
function weekPaused(k){const end=addDays(k,6);
  return S.pauses.some(p=>p.from<=end&&p.to>=k)||(S.pause&&S.pause.since<=end);}
function weekMap(){const w={};const g=k=>w[k]||(w[k]={s:0,r:0});
  S.log.forEach(l=>g(weekKey(l.date)).s++);S.runs.forEach(r=>g(weekKey(r.date)).r++);return w;}
function xpCalc(){
  const w=weekMap();let sess=0,run=0,bonus=0,streak=0,bestStreak=0;
  for(const k in w){sess+=Math.min(w[k].s,4)*XP.sess;run+=Math.min(w[k].r,3)*XP.run;}
  const steps=S.steps.filter(x=>x.n>=10000).length*XP.steps;
  if(S.start){const cur=mondayOf(parse(S.start));const end=weekKey(today());
    for(let guard=0;guard<600;guard++){const k=iso(cur);const x=w[k]||{s:0,r:0};const met=x.s>=S.goal.s&&x.r>=S.goal.r;
      if(met){streak++;bonus+=XP.week+Math.min(XP.weekCap,XP.weekStep*(streak-1));}
      else if(k!==end&&!weekPaused(k))streak=0;
      bestStreak=Math.max(bestStreak,streak);
      if(k>=end)break;cur.setDate(cur.getDate()+7);}}
  const led={stage:0,best:0,boss:0,exam:0,deload:0};
  S.ev.forEach(e=>{led[e.t]=(led[e.t]||0)+(e.xp||0);});
  const total=sess+run+steps+bonus+led.stage+led.best+led.boss+led.exam+led.deload;
  return {total,sess,run,steps,bonus,streak,bestStreak,led};
}
const cum=n=>500*(n-1)+75*(n-1)*(n-2);
function levelOf(xp){let n=1;while(xp>=cum(n+1))n++;return n;}
function rankIdx(){return Math.min(S.exam.passed||0,RANKS.length-1);}
function examReady(lvl){const nx=rankIdx()+1;return nx<RANKS.length&&lvl>=RANKS[nx].lvl&&!S.exam.cur;}

function bestAt(k,ds){let b=null;S.bests.forEach(x=>{if(x.k===k&&x.date<=ds&&(b===null||x.v>b))b=x.v;});return b;}
function baseOf(k){const f=S.bests.find(x=>x.k===k);return f?f.v:BASE[k];}
function curBest(k){const b=bestAt(k,'9999-12-31');return b===null?BASE[k]:b;}
function runInfo(ds){let long=0,first=null,best=null;
  S.runs.forEach(r=>{if(r.date>ds)return;long=Math.max(long,r.km);
    if(r.km>=3){const p=r.min/r.km;if(first===null)first=p;if(best===null||p<best)best=p;}});
  return {long,first,best};}
function statsAt(ds){
  const st={str:10,sta:10,ker:10,aus:10};
  S.ev.forEach(e=>{if(e.t==='stage'&&e.date<=ds){const k=catOf(e.ex);st[k]+=k==='ker'?2:1;}});
  Object.keys(TESTS).forEach(k=>{const b=bestAt(k,ds);if(b!==null)st[TESTS[k].stat]+=Math.max(0,Math.floor((b-baseOf(k))/TESTS[k].per));});
  const r=runInfo(ds);
  if(r.long>3)st.aus+=Math.floor((r.long-3)/0.5);
  if(r.first!==null)st.aus+=Math.max(0,Math.floor((r.first-r.best)*60/5));
  return st;
}
function snapshot(){const r=runInfo(today());
  return {pull:curBest('pull'),push:curBest('push'),dip:curBest('dip'),split:curBest('split'),long:r.long,bestPace:r.best,
    dipsOK:S.ev.some(e=>e.t==='stage'&&e.ex==='a2'&&e.opt===0&&e.lvl>=4)};}

/* ================= Aktionen ================= */
let LASTXP=0;
function commit(label){
  tick();save();
  const x=xpCalc(),diff=x.total-LASTXP;LASTXP=x.total;
  const lvl=levelOf(x.total);let msg=label||'';
  if(diff>0)msg+=(msg?' · ':'')+'+'+nf(diff)+' XP';
  if(lvl>S.seenLvl){S.seenLvl=lvl;save();msg+=(msg?'\n':'')+'Level '+lvl+' erreicht';
    if(examReady(lvl))msg+='\nRangprüfung bereit';}
  if(msg)toast(msg);
  render();
}
let TOASTT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(TOASTT);TOASTT=setTimeout(()=>{t.hidden=true;},3200);}

function addLog(ds,id,note){S.log.push({date:ds,s:id,note:note||''});if(!S.start||ds<S.start)S.start=ds;}
function addRun(ds,kmv,min){
  const before=runInfo('9999-12-31');
  S.runs=S.runs.filter(x=>x.date!==ds);S.runs.push({date:ds,km:kmv,min,kg:curWeight()});
  S.runs.sort((a,b)=>a.date<b.date?-1:1);if(!S.start||ds<S.start)S.start=ds;
  const out=[];
  if(kmv>=3&&before.best!==null&&min/kmv<before.best-1e-9){S.ev.push({date:ds,t:'best',k:'pace',xp:XP.best,label:'Bestzeit auf 3 km'});out.push('Neue Bestzeit');}
  if(before.long>=3&&kmv>=before.long+0.5){S.ev.push({date:ds,t:'best',k:'dist',xp:XP.best,label:'Längste Strecke: '+km(kmv)+' km'});out.push('Längste Strecke');}
  return out;
}
function addBest(k,v){const prev=curBest(k);S.bests.push({date:today(),k,v});S.lastTest=today();
  if(v>prev){S.ev.push({date:today(),t:'best',k,xp:XP.best,label:'Bestwert '+TESTS[k].n+': '+v});return true;}return false;}
function setLevel(e,lvl){const st=exState(e.id);let n=0;
  for(let l=1;l<=lvl;l++)if(!S.ev.some(x=>x.t==='stage'&&x.ex===e.id&&x.opt===st.opt&&x.lvl===l)){
    S.ev.push({date:today(),t:'stage',ex:e.id,opt:st.opt,lvl:l,xp:XP.stage});n++;}
  st.lvl=lvl;st.since=today();return n;}
function setPause(on){
  if(on&&!S.pause){S.pause={since:today()};}
  else if(!on&&S.pause){const d=daysBetween(S.pause.since,today());S.pauses.push({from:S.pause.since,to:today()});S.pause=null;
    if(d>0){if(S.boss.cur)S.boss.cur.until=addDays(S.boss.cur.until,d);if(S.boss.next)S.boss.next=addDays(S.boss.next,d);
      if(S.exam.cur)S.exam.cur.until=addDays(S.exam.cur.until,d);if(S.deload)S.deload.from=addDays(S.deload.from,d);}}
}
function startExam(){const i=rankIdx()+1,E=EXAMS[i],b=snapshot();
  S.exam.cur={rank:i,from:today(),until:addDays(today(),E.days),xp:E.xp,name:E.name,
    parts:E.parts(b).map(p=>({l:p.l,t:p.t,auto:p.auto||0,done:null}))};}
function checkExam(){const X2=S.exam.cur;if(!X2)return false;
  X2.parts.forEach(p=>{if(p.auto&&!p.done){const ks=new Set(S.ev.filter(e=>e.t==='best'&&e.date>=X2.from&&e.date<=X2.until).map(e=>e.k));
    if(ks.size>=p.auto)p.done=today();}});
  if(X2.parts.every(p=>p.done)){S.exam.passed=X2.rank;S.ev.push({date:today(),t:'exam',xp:X2.xp,label:X2.name});S.exam.cur=null;return true;}
  return false;}
function spawnBoss(){const b=snapshot();const recent=[...S.boss.done,...S.boss.fled].sort((a,x)=>a.date<x.date?-1:1).slice(-4).map(x=>x.id);
  let pool=BOSSES.filter(B=>(!B.ok||B.ok(b))&&!recent.includes(B.id));if(!pool.length)pool=BOSSES.filter(B=>!B.ok||B.ok(b));
  const B=pool[rnd(0,pool.length-1)];
  S.boss.cur={id:B.id,n:B.n,text:B.t(b),sw:B.sw,xp:B.xp,from:today(),until:addDays(today(),rnd(5,7))};}
function tick(){
  const t=today(),B=S.boss;
  if(S.live&&S.live.date!==t)S.live=null;
  if(S.deload&&!paused()&&daysBetween(S.deload.from,t)>=7){S.ev.push({date:t,t:'deload',xp:XP.deload,label:'Deload-Woche eingehalten'});S.lastDeload=t;S.deload=null;}
  if(B.cur&&!paused()&&t>B.cur.until){B.fled.push({id:B.cur.id,date:t});B.cur=null;B.next=addDays(t,rnd(10,14));}
  if(S.exam.cur&&!paused()&&t>S.exam.cur.until){S.exam.failed.push({rank:S.exam.cur.rank,date:t});S.exam.cur=null;}
  if(!B.next&&S.start)B.next=addDays(S.start,rnd(7,10));
  if(!B.cur&&B.next&&t>=B.next&&!paused()&&!S.deload&&!S.exam.cur&&S.log.length>=3)spawnBoss();
  if(checkExam())showRankUp(S.exam.passed);
}

/* ================= Wappen ================= */
function hexPts(r){const p=[];for(let k=0;k<6;k++){const a=(-90+60*k)*Math.PI/180;p.push((60+r*Math.cos(a)).toFixed(1)+','+(60+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function star4(x,y,r){const q=r*.28;return `M${x},${y-r} L${x+q},${y-q} L${x+r},${y} L${x+q},${y+q} L${x},${y+r} L${x-q},${y+q} L${x-r},${y} L${x-q},${y-q} Z`;}
function emblem(i,size){
  const R=RANKS[i];let g='';
  const rays=i===6?20:i===7?28:0;
  for(let k=0;k<rays;k++){const a=k*2*Math.PI/rays-Math.PI/2;if(i===6&&Math.abs(Math.cos(a))>.72)continue;
    const r1=i===7?35:41,r2=k%2?r1+8:r1+15;
    g+=`<line x1="${(60+r1*Math.cos(a)).toFixed(1)}" y1="${(60+r1*Math.sin(a)).toFixed(1)}" x2="${(60+r2*Math.cos(a)).toFixed(1)}" y2="${(60+r2*Math.sin(a)).toFixed(1)}" stroke="currentColor" stroke-width="${k%2?1.4:2.4}" stroke-linecap="round"/>`;}
  const feathers=i===3?1:i===4?2:i===5?3:i===6?4:0;
  for(let f=0;f<feathers;f++){const y=44+f*9,d=`M90,${y} L${116-f*5},${26+f*13} L90,${y+7} Z`;
    g+=`<path d="${d}" fill="currentColor"/><path d="${d}" fill="currentColor" transform="translate(120,0) scale(-1,1)"/>`;}
  if(i===7){
    g+=`<circle cx="60" cy="60" r="30" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="3"/>`;
    g+=`<path d="M40,60 Q60,42 80,60 Q60,78 40,60 Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="60" cy="60" r="6.5" fill="currentColor"/>`;
  }else{
    g+=`<polygon points="${hexPts(34)}" fill="currentColor" fill-opacity="${i===5?1:i>=2?.14:0}" stroke="currentColor" stroke-width="${i===0?2.2:3}" stroke-linejoin="round"${i===6?' stroke-dasharray="27 7"':''}/>`;
    if(i>=1&&i!==6)g+=`<polygon points="${hexPts(27)}" fill="none" stroke="${i===5?'var(--bg)':'currentColor'}" stroke-width="1.3" stroke-linejoin="round"/>`;
    if(i===6)g+=`<path d="M67,36 L49,63 L59,63 L53,86 L72,56 L61,56 Z" fill="currentColor"/>`;
    else g+=`<text x="60" y="74" text-anchor="middle" font-size="40" fill="${i===5?'var(--bg)':'currentColor'}">${R.code}</text>`;
  }
  const chev=i===2?1:(i>=3&&i<=5)?2:0;
  for(let j=0;j<chev;j++)g+=`<path d="M48,${100+j*7} L60,${106+j*7} L72,${100+j*7}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(i===4)g+=`<path d="${star4(60,13,7)}" fill="currentColor"/>`;
  if(i===5)g+=`<path d="${star4(42,18,5)}" fill="currentColor"/><path d="${star4(60,12,7.5)}" fill="currentColor"/><path d="${star4(78,18,5)}" fill="currentColor"/>`;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" class="emb" style="color:var(--r${i});flex:none" role="img" aria-label="${R.title}">${g}</svg>`;
}
function rune(id,size){let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))>>>0;const pts=[],used=new Set();
  for(let g=0;g<60&&pts.length<5;g++){h=(Math.imul(h,1103515245)+12345)>>>0;const p=(h>>>16)%9;if(!used.has(p)){used.add(p);pts.push(p);}}
  const d=pts.map((p,i)=>(i?'L':'M')+(20+(p%3)*10)+','+(20+Math.floor(p/3)*10)).join(' ');
  return `<svg viewBox="0 0 60 60" width="${size}" height="${size}" style="color:var(--r5)" aria-hidden="true"><polygon points="30,4 52.5,17 52.5,43 30,56 7.5,43 7.5,17" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function showRankUp(i){const o=$('#rankup');
  o.innerHTML=`<div class="eyebrow">Rangaufstieg</div>${emblem(i,190)}<div class="rn" style="color:var(--r${i})">${esc(RANKS[i].code?RANKS[i].code+'-Rang':RANKS[i].name)}</div><div class="today-sub">${esc(RANKS[i].code?RANKS[i].name:'Jenseits der Ränge')}</div><button class="btn" id="ruX">Weiter</button>`;
  o.hidden=false;o.querySelector('#ruX').onclick=()=>{o.hidden=true;};}

/* ================= Pausen-Timer ================= */
let T=null,AC=null,WL=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(AC)[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
function startTimer(sec,label){stopTimer();T={end:Date.now()+sec*1000,label,done:false};ensureAudio();wake(true);
  const bar=$('#timer');bar.hidden=false;bar.classList.remove('done');T.int=setInterval(drawTimer,250);drawTimer();}
function drawTimer(){if(!T)return;const left=Math.ceil((T.end-Date.now())/1000),bar=$('#timer');
  $('#tmL').textContent=T.label;
  if(left<=0){if(!T.done){T.done=true;beep();bar.classList.add('done');T.hide=setTimeout(stopTimer,30000);}$('#tmT').textContent='Weiter';}
  else $('#tmT').textContent=fmtTime(left/60);}
function stopTimer(){if(!T)return;clearInterval(T.int);clearTimeout(T.hide);T=null;$('#timer').hidden=true;wake(false);}
$('#tmX').onclick=stopTimer;
$('#tmP').onclick=()=>{if(!T)return;T.end=Math.max(T.end,Date.now())+30000;T.done=false;clearTimeout(T.hide);$('#timer').classList.remove('done');drawTimer();};
function liveSets(id){return S.live&&S.live.date===today()&&S.live.sets[id]||0;}

/* ================= Rendern ================= */
let TAB='heute',SUB='kalender',SEL=null,LOGDATE=null,CAL=null,NOTE='';
const view=$('#view'),host=$('#sheetHost');
function go(t){TAB=t;render();window.scrollTo(0,0);}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t);});
$('#hdr').onclick=()=>go('status');

function render(){
  const x=xpCalc(),lvl=levelOf(x.total);
  $('#todayLabel').textContent=dayName(today())+' '+fmtDate(today());
  $('#hdr').innerHTML=emblem(rankIdx(),28)+'<span class="num">Lv '+lvl+'</span>';
  document.querySelectorAll('#tabs button').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.t===TAB));
    b.classList.toggle('alert',b.dataset.t==='status'&&(!!S.boss.cur||!!S.exam.cur||examReady(lvl)));});
  view.innerHTML='';
  ({heute:vHeute,plan:vPlan,status:vStatus,verlauf:vVerlauf,mehr:vMehr})[TAB](x,lvl);
}

function examCard(lvl,full){
  const i=rankIdx(),nx=i+1,X2=S.exam.cur;
  if(X2){
    const left=daysBetween(today(),X2.until);
    const c1=el(`<section class="card"><div class="eyebrow" style="color:var(--r${X2.rank})">Rangprüfung · ${left<=0?'letzter Tag':'noch '+left+(left===1?' Tag':' Tage')}${paused()?' · pausiert':''}</div>
      <div class="today-title" style="font-size:24px">${esc(X2.name)}</div>
      <div class="muted">Alle Teile müssen im Zeitraum bestanden sein. Belohnung: ${nf(X2.xp)} XP und der Rang ${esc(RANKS[X2.rank].title)}.</div>
      <div id="parts" style="margin-top:8px"></div></section>`);
    const ps=c1.querySelector('#parts');
    X2.parts.forEach((p,k)=>{
      const r=el(`<div class="part${p.done?' ok':''}"><div class="pt"><div class="pl">Teil ${k+1} · ${esc(p.l)}</div>${esc(p.t)}</div>
        ${p.done?'<span class="tick">bestanden</span>':p.auto?'<span class="tick" style="color:var(--fg-dim)">zählt selbst</span>':'<button class="btn small">Bestanden</button>'}</div>`);
      const b=r.querySelector('button');if(b)b.onclick=()=>{p.done=today();commit('Teil '+(k+1)+' bestanden');};
      ps.appendChild(r);});
    return c1;
  }
  if(nx>=RANKS.length)return full?el(`<section class="card"><h2>Rangprüfung</h2><p class="muted" style="margin:0">Höchster Rang erreicht.</p></section>`):null;
  if(lvl>=RANKS[nx].lvl){
    const E=EXAMS[nx],prev=E.parts(snapshot());

const NS='http://www.w3.org/2000/svg';
function radar(st){
  const mx=Math.max(20,Math.ceil(Math.max(st.str,st.sta,st.ker,st.aus)/10)*10),cx=160,cy=120,R=68;
  const ax=[['str',0,-1,'Stärke'],['sta',1,0,'Stand'],['ker',0,1,'Kern'],['aus',-1,0,'Ausdauer']];
  let g='';
  [.5,1].forEach(f=>{g+=`<polygon points="${ax.map(a=>(cx+a[1]*R*f)+','+(cy+a[2]*R*f)).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  ax.forEach(a=>{g+=`<line x1="${cx}" y1="${cy}" x2="${cx+a[1]*R}" y2="${cy+a[2]*R}" stroke="var(--line)" stroke-width="1"/>`;});
  g+=`<polygon points="${ax.map(a=>(cx+a[1]*R*st[a[0]]/mx).toFixed(1)+','+(cy+a[2]*R*st[a[0]]/mx).toFixed(1)).join(' ')}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  ax.forEach(a=>{g+=`<circle cx="${(cx+a[1]*R*st[a[0]]/mx).toFixed(1)}" cy="${(cy+a[2]*R*st[a[0]]/mx).toFixed(1)}" r="3.2" fill="var(--accent)"/>`;
    const lx=cx+a[1]*(R+10),ly=cy+a[2]*(R+10);const anchor=a[1]>0?'start':a[1]<0?'end':'middle';
    const y1=a[2]<0?ly-16:a[2]>0?ly+16:ly-3,y2=a[2]<0?ly-3:a[2]>0?ly+30:ly+12;
    g+=`<text x="${lx}" y="${y1}" text-anchor="${anchor}" font-size="18" font-weight="600" fill="var(--fg)" style="font-family:var(--f-disp)">${st[a[0]]}</text>`;
    g+=`<text x="${lx}" y="${y2}" text-anchor="${anchor}" font-size="10.5" letter-spacing="1" fill="var(--fg-dim)" style="font-family:var(--f-disp);text-transform:uppercase">${a[3]}</text>`;});
  return `<svg viewBox="0 0 320 240" style="width:100%;height:auto;max-width:360px;display:block;margin:0 auto" role="img" aria-label="Stats: Stärke ${st.str}, Standfestigkeit ${st.sta}, Kern ${st.ker}, Ausdauer ${st.aus}">${g}</svg>`;
}

function lineChart(points,opts){
  const W=320,H=140,P={l:34,r:8,t:10,b:20};
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('style','width:100%;height:auto');svg.setAttribute('role','img');
  const txt=(x,y,anchor,s)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);
    t.setAttribute('text-anchor',anchor);t.setAttribute('fill','var(--fg-dim)');t.setAttribute('font-size','9');t.textContent=s;svg.appendChild(t);};
  if(points.length<2){txt(W/2,H/2,'middle','Noch zu wenig Daten');return svg;}
  const xs=points.map(p=>parse(p.x).getTime()),ys=points.flatMap(p=>[p.y,p.y2].filter(v=>v!=null));
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||1;y0-=pad;y1+=pad;
  const Xf=v=>P.l+(W-P.l-P.r)*((v-x0)/((x1-x0)||1));
  const Yf=v=>P.t+(H-P.t-P.b)*(1-(v-y0)/((y1-y0)||1));
  [y0,(y0+y1)/2,y1].forEach(v=>{const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',P.l);l.setAttribute('x2',W-P.r);l.setAttribute('y1',Yf(v));l.setAttribute('y2',Yf(v));
    l.setAttribute('stroke','var(--line)');l.setAttribute('stroke-width','1');svg.appendChild(l);
    txt(P.l-5,Yf(v)+3.5,'end',opts.fmt?opts.fmt(v):v.toFixed(1).replace('.',','));});
  txt(Xf(xs[0]),H-6,'start',fmtDate(points[0].x));
  txt(Xf(xs[xs.length-1]),H-6,'end',fmtDate(points[points.length-1].x));
  points.forEach(p=>{const ci=document.createElementNS(NS,'circle');
    ci.setAttribute('cx',Xf(parse(p.x).getTime()));ci.setAttribute('cy',Yf(p.y));ci.setAttribute('r','2.2');
    ci.setAttribute('fill','var(--fg-dim)');ci.setAttribute('opacity','.55');svg.appendChild(ci);});
  const d=points.map((p,k)=>(k?'L':'M')+Xf(parse(p.x).getTime()).toFixed(1)+' '+Yf(p.y2).toFixed(1)).join(' ');
  const path=document.createElementNS(NS,'path');path.setAttribute('d',d);path.setAttribute('fill','none');
  path.setAttribute('stroke','var(--accent)');path.setAttribute('stroke-width','2.2');
  path.setAttribute('stroke-linejoin','round');path.setAttribute('stroke-linecap','round');svg.appendChild(path);
  const last=points[points.length-1];
  const ce=document.createElementNS(NS,'circle');ce.setAttribute('cx',Xf(parse(last.x).getTime()));
  ce.setAttribute('cy',Yf(last.y2));ce.setAttribute('r','3.4');ce.setAttribute('fill','var(--accent)');svg.appendChild(ce);
  return svg;
}

    <p class="muted" style="margin:0 0 10px">Alles liegt nur auf diesem Gerät. ${S.lastBackup?'Letzte Sicherung am '+fmtDate(S.lastBackup)+'.':'Noch keine Sicherung.'}</p>
    ${HOSTED?'<button class="btn" id="fs" style="margin-top:0">Sicherung als Datei speichern</button>':''}
    <label for="fl" style="margin-top:12px">Sicherung aus Datei laden</label><input id="fl" type="file" accept=".json,application/json,text/plain">
    <label for="ta" style="margin-top:12px">Oder als Text</label>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="btns"><button class="btn small" id="cp">Text kopieren</button><button class="btn small ghost" id="im">Eingefügten Text laden</button></div>
    <div class="hint" id="msg"></div>
    <div class="eyebrow" style="margin-top:22px">Zurücksetzen</div>
    <button class="btn ghost" id="rs" style="margin-top:6px">Alle Daten löschen</button>
    <div id="confirm"></div></section>`);
  const ta=c1.querySelector('#ta'),msg=c1.querySelector('#msg');ta.value=JSON.stringify(S);
  const marked=()=>{S.lastBackup=today();save();};
  const loadText=t=>{try{S=migrate(JSON.parse(t));save();LASTXP=xpCalc().total;S.seenLvl=levelOf(LASTXP);save();toast('Sicherung geladen');render();}catch(e){msg.textContent='Das ist keine gültige Sicherung.';}};
  const fs=c1.querySelector('#fs');
  if(fs)fs.onclick=async()=>{const name='trainingslog-'+today()+'.json',file=new File([JSON.stringify(S)],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});marked();msg.textContent='Gesichert.';return;}}
    catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();marked();msg.textContent='Datei gespeichert.';};
  c1.querySelector('#fl').onchange=ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadText(String(rd.result));rd.readAsText(f);};
  c1.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);marked();msg.textContent='Kopiert. Leg den Text irgendwo ab, zum Beispiel in den Notizen.';}
    catch(e){ta.select();msg.textContent='Text ist markiert. Jetzt kopieren.';}};
  c1.querySelector('#im').onclick=()=>loadText(ta.value);
  c1.querySelector('#rs').onclick=()=>{const box=c1.querySelector('#confirm');if(box.firstChild){box.innerHTML='';return;}
    const b=el(`<div class="banner" style="margin-top:10px"><b>Sicher?</b>Einheiten, Läufe, Gewichte, Stufen, Level und Trophäen werden gelöscht.
      <button class="btn ghost small" id="yes">Ja, alles löschen</button></div>`);
    b.querySelector('#yes').onclick=()=>{S=migrate({});save();LASTXP=0;toast('Alles gelöscht');render();};box.appendChild(b);};
  view.appendChild(c1);

  view.appendChild(el(`<section class="card"><h2>Regeln in Kürze</h2>
    <table><tbody>
    <tr><td>Einheit, höchstens 4 pro Woche</td><td class="r num">${XP.sess} XP</td></tr>
    <tr><td>Lauf, höchstens 3 pro Woche</td><td class="r num">${XP.run} XP</td></tr>
    <tr><td>Wochenziel erreicht</td><td class="r num">${XP.week}–${XP.week+XP.weekCap} XP</td></tr>
    <tr><td>Neue Stufe einer Übung</td><td class="r num">${XP.stage} XP</td></tr>
    <tr><td>Neuer Bestwert</td><td class="r num">${XP.best} XP</td></tr>
    <tr><td>Deload-Woche eingehalten</td><td class="r num">${XP.deload} XP</td></tr>
    <tr><td>Boss besiegt</td><td class="r num">300–500 XP</td></tr>
    <tr><td>Rangprüfung bestanden</td><td class="r num">500–2.500 XP</td></tr>
    <tr><td>Tag mit 10.000 Schritten</td><td class="r num">${XP.steps} XP</td></tr>
    </tbody></table>
    <p class="muted" style="margin:10px 0 0">Punkte gehen nie verloren. Das Level steigt mit den Punkten, der Rang erst mit bestandener Prüfung, die Stats nur mit echter Progression. Laufkalorien: Körpergewicht in kg mal Strecke in km.</p></section>`));
}

/* ================= Start ================= */
tick();save();
LASTXP=xpCalc().total;
if(levelOf(LASTXP)>S.seenLvl){S.seenLvl=levelOf(LASTXP);save();}
render();
let RDAY=today();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;drawTimer();
  if(today()!==RDAY){RDAY=today();tick();save();render();}});
if(HOSTED&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
