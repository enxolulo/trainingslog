<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#2f2a3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14111b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}img{max-width:100%}</style>
<title>Trainingslog</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte, Statusleiste oben, Tableiste unten. Pixel-Look im Geist alter 16-Bit-Rollenspiele: Pergament, braune Rahmen, harte Schatten. Nachts ein dunkles Gewölbe. */
:root{
  --bg:#efe2c0;
  --surface:#fbf4df;
  --surface-2:#eadbb4;
  --line:#c9b488;
  --frame:#8a5a34;
  --frame-d:#5e3b20;
  --fg:#3b2a1e;
  --fg-dim:#75604a;
  --accent:#58a653;
  --accent-d:#356b33;
  --accent-ink:#11260f;
  --warn:#a85a12;
  --boss:#b83a2c;
  --dun:#2f2a3a;
  --dun-2:#3d3650;
  --dun-fg:#f3e7c9;
  --dun-dim:#b9adc9;
  --gold:#a6770f;
  --m-base:#cfc3a1;
  --m-sil:#e6dab6;
  --h1:#bcdcae;
  --h2:#8fc97f;
  --h3:#58a653;
  --h4:#2f7a34;
  --r0:#5e6775;
  --r1:#8a5527;
  --r2:#1f6f68;
  --r3:#2d4f85;
  --r4:#5e3d94;
  --r5:#8a6408;
  --r6:#8a2a1f;
  --r7:#1f1b2e;
  --q0:#6d7279;
  --q1:#2f5fa6;
  --q2:#6f47ad;
  --q3:#946c00;
  --f-disp:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1824;
  --surface:#2a2536;
  --surface-2:#352f45;
  --line:#4a4260;
  --frame:#7a6d9c;
  --frame-d:#3d3555;
  --fg:#efe6d0;
  --fg-dim:#aba1bb;
  --accent:#6fc267;
  --accent-d:#3d7d3c;
  --accent-ink:#0d1f0c;
  --warn:#e0a04f;
  --boss:#ef6a5a;
  --dun:#14111b;
  --dun-2:#241f30;
  --dun-fg:#f3e7c9;
  --dun-dim:#a99fb8;
  --gold:#f2c14e;
  --m-base:#4a4260;
  --m-sil:#322c40;
  --h1:#2f5a38;
  --h2:#3d7d3c;
  --h3:#58a653;
  --h4:#8fd486;
  --r0:#aeb8c6;
  --r1:#d99a5e;
  --r2:#5fc9bf;
  --r3:#7fa9ea;
  --r4:#b79be0;
  --r5:#f2c14e;
  --r6:#f08273;
  --r7:#f2f6f5;
  --q0:#aeb4bc;
  --q1:#7fa9ea;
  --q2:#b79be0;
  --q3:#f2c14e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b1824;
  --surface:#2a2536;
  --surface-2:#352f45;
  --line:#4a4260;
  --frame:#7a6d9c;
  --frame-d:#3d3555;
  --fg:#efe6d0;
  --fg-dim:#aba1bb;
  --accent:#6fc267;
  --accent-d:#3d7d3c;
  --accent-ink:#0d1f0c;
  --warn:#e0a04f;
  --boss:#ef6a5a;
  --dun:#14111b;
  --dun-2:#241f30;
  --dun-fg:#f3e7c9;
  --dun-dim:#a99fb8;
  --gold:#f2c14e;
  --m-base:#4a4260;
  --m-sil:#322c40;
  --h1:#2f5a38;
  --h2:#3d7d3c;
  --h3:#58a653;
  --h4:#8fd486;
  --r0:#aeb8c6;
  --r1:#d99a5e;
  --r2:#5fc9bf;
  --r3:#7fa9ea;
  --r4:#b79be0;
  --r5:#f2c14e;
  --r6:#f08273;
  --r7:#f2f6f5;
  --q0:#aeb4bc;
  --q1:#7fa9ea;
  --q2:#b79be0;
  --q3:#f2c14e;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;font-weight:600;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.pix{font-family:var(--f-disp)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}

/* Statusleiste */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--dun);color:var(--dun-fg);border-bottom:3px solid var(--frame-d)}
header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--dun)}
#hud{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;margin:0 auto;padding:7px 16px;background:none;border:0;color:inherit;text-align:left}
#hud .lv{font-family:var(--f-disp);font-size:19px;font-weight:600;line-height:1;white-space:nowrap}
#hud .xp{flex:1;min-width:0}
#hud .xp small{display:block;font-family:var(--f-disp);font-size:12px;line-height:1.1;color:var(--dun-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .gold{display:flex;align-items:center;gap:4px;font-family:var(--f-disp);font-size:18px;font-weight:600;color:#f2c14e}
.bar{height:8px;background:#0c0a12;border:2px solid #0c0a12;margin-top:3px}
.bar i{display:block;height:100%;background:#58a653;box-shadow:inset 0 2px 0 #93d18e}
.bar.hp i{background:#d24b3e;box-shadow:inset 0 2px 0 #ef7d6e}

main{padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border:3px solid var(--frame);box-shadow:0 4px 0 var(--frame-d);padding:13px;min-width:0}
.card>h2{font-size:18px;margin-bottom:10px}
.eyebrow{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
.muted{color:var(--fg-dim);font-size:13px}
.hint{color:var(--fg-dim);font-size:13px;margin-top:8px}
/* Karte und Dungeon im Schnitt: Bild in voller Breite, Beschriftung liegt als HTML darüber */
.mapwrap,.secwrap{position:relative;border:3px solid var(--frame-d);line-height:0;background:#14111b}
.mapwrap img.px,.secwrap img.px{width:100%;height:auto}
.mtag{position:absolute;transform:translateX(-50%);background:#14111b;color:#f3e7c9;border:2px solid #0c0a12;font-family:var(--f-disp);font-size:12px;line-height:1;padding:3px 5px 4px;white-space:nowrap;z-index:2}
.mtag b{color:#f2c14e;margin-left:5px;font-weight:600}
.mtag.sug{border:2px dashed #f2c14e}
.mhit{position:absolute;width:20%;height:30%;z-index:1;background:transparent;border:0;padding:0}
.fl,.fr{position:absolute;font-family:var(--f-disp);font-size:13px;line-height:1;padding:3px 5px;background:#14111b;color:#b9adc9;white-space:nowrap}
.fl{left:3%;min-width:13%;text-align:center}
.fr{right:2%}
.fl.ok{color:#93d18e}
.fl.cur,.fr.cur{background:#f2c14e;color:#2a2233;font-weight:600}
.fr:not(.cur){background:#b83a2c;color:#f3e7c9}
.trk{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.trk b{display:block;font-family:var(--f-disp);font-size:16px;line-height:1.15;font-weight:600}
.trk span{display:block;font-size:12.5px;color:var(--fg-dim)}
.trk .r{text-align:right}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:3px solid var(--frame);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar>div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabbar button{position:relative;background:none;border:0;border-top:4px solid transparent;margin-top:-3px;padding:11px 2px 10px;font-family:var(--f-disp);font-size:15px;font-weight:500;color:var(--fg-dim)}
.tabbar button[aria-selected="true"]{color:var(--fg);border-top-color:var(--accent);background:var(--surface-2)}
.tabbar button.alert::after{content:"";position:absolute;top:7px;right:calc(50% - 26px);width:8px;height:8px;background:var(--boss)}

.today-title{font-family:var(--f-disp);font-size:24px;line-height:1.1;font-weight:600;margin:2px 0}
.today-sub{color:var(--fg-dim);font-size:14px}
.btn{display:block;width:100%;border:3px solid var(--frame-d);background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:20px;font-weight:600;letter-spacing:.03em;padding:11px;margin-top:12px;text-align:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 3px 0 var(--frame-d)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 1px 0 var(--frame-d)}
.btn.ghost{background:var(--surface-2);color:var(--fg);font-size:16px;padding:9px}
.btn.small{width:auto;padding:6px 11px;font-size:15px;margin-top:0}
.btn.danger{background:var(--boss);color:#fff}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{background:var(--surface);border:3px solid var(--frame);box-shadow:0 3px 0 var(--frame-d);padding:6px 2px 5px;text-align:center;min-width:0}
.seg button b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1;font-weight:600}
.seg.three button b{font-size:17px;padding:3px 0}
.seg.four button{overflow:hidden}
.seg.four button b{font-size:14px;padding:5px 0}
@media(max-width:350px){.seg.four button b{font-size:12px}}
.seg button span{display:block;font-size:11px;color:var(--fg-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sug{border-style:dashed}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--frame-d);border-style:solid;color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:var(--accent-ink)}
.card .seg button{background:var(--surface-2)}
.card .seg button[aria-pressed="true"]{background:var(--accent)}

/* Dungeon */
.dun{background:var(--dun);color:var(--dun-fg);border:3px solid var(--frame);box-shadow:0 4px 0 var(--frame-d);padding:13px;min-width:0}
.dun .eyebrow{color:var(--dun-dim)}
.dun .muted{color:var(--dun-dim)}
.dun-name{font-family:var(--f-disp);font-size:25px;line-height:1.1;font-weight:600}
.bossrow{display:flex;gap:12px;align-items:center;margin-top:12px}
.bosspic{flex:none;width:104px;height:104px;display:flex;align-items:center;justify-content:center;background:var(--dun-2);border:3px solid #0c0a12}
.bossinfo{flex:1;min-width:0}
.bossname{font-family:var(--f-disp);font-size:18px;line-height:1.2;font-weight:600}
.cond{margin-top:10px;padding:8px 10px;background:var(--dun-2);border-left:4px solid #f2c14e;font-size:14px;line-height:1.4}
.cond b{font-family:var(--f-disp);font-size:15px;color:#f2c14e;display:block}

ul.ex{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.ex li{background:var(--surface-2);display:flex;align-items:stretch;border:2px solid var(--line)}
ul.ex li.fin{opacity:.55}
.ex-main{flex:1;min-width:0;background:none;border:0;padding:8px 6px 8px 10px;display:flex;gap:9px;align-items:flex-start;text-align:left}
.ex-i{font-family:var(--f-disp);font-size:17px;color:var(--fg-dim);min-width:14px}
.ex-b{flex:1;min-width:0}
.ex-n{display:block;font-weight:600;line-height:1.3}
.ex-m{display:block;font-size:13px;color:var(--fg-dim);margin-top:1px}
.ex-h{display:block;font-size:12.5px;color:var(--fg-dim);line-height:1.35;margin-top:2px}
.chip{display:inline-block;font-family:var(--f-disp);font-size:13px;background:var(--frame);color:var(--surface);padding:0 7px;margin-top:5px}
.ex-t{flex:none;width:66px;background:var(--accent);color:var(--accent-ink);border:0;border-left:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.15)}
.ex-t b{font-family:var(--f-disp);font-size:22px;line-height:1;font-weight:600}
.ex-t span{font-family:var(--f-disp);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);padding:0}

#timer{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:31;max-width:536px;margin:0 auto;background:var(--dun);color:var(--dun-fg);border:3px solid var(--frame);box-shadow:0 4px 0 var(--frame-d);padding:8px 9px 8px 12px;display:flex;align-items:center;gap:10px}
#timer.done{background:var(--accent);color:var(--accent-ink)}
#timer .tl{flex:1;min-width:0;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer .tl small{display:block;font-family:var(--f-disp);font-size:12px;opacity:.75}
#timer .tt{font-family:var(--f-disp);font-size:32px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
#timer button{background:none;border:2px solid currentColor;padding:4px 8px;font-family:var(--f-disp);font-size:15px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.week .dn{text-align:center;font-family:var(--f-disp);font-size:13px;color:var(--fg-dim)}
.week .cell{height:42px;width:100%;padding:0;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--fg);border:2px solid var(--line);min-width:0}
.week .cell b{font-family:var(--f-disp);font-size:17px;line-height:1.1;font-weight:600}
.week .cell span{font-size:10.5px;line-height:1.1}
.week .cell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-d)}
.week .cell.run{border-color:var(--accent-d);color:var(--accent-d)}
.week .cell.today{border-color:var(--fg);border-width:3px}
.week .cell:disabled{opacity:.45;cursor:default}
.week.month .cell{height:50px;justify-content:flex-start;padding-top:3px;gap:1px}
.week.month .cell i{font-style:normal;font-size:10.5px;line-height:1;opacity:.75;font-variant-numeric:tabular-nums}
.week.month .cell.out{visibility:hidden}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{flex:1;text-align:center;font-size:19px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid var(--line)}
.entry span{min-width:0}

/* Held, Inventar */
.herowrap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.herocol{display:flex;flex-direction:column;gap:6px}
.herocol.r{align-items:flex-end}
.heropic{display:flex;align-items:center;justify-content:center;min-width:0}
.slotb{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left;font-size:12px;color:var(--fg-dim);min-width:0}
.herocol.r .slotb{flex-direction:row-reverse;text-align:right}
.tile{position:relative;flex:none;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:3px solid var(--line)}
.tile.q0{border-color:var(--q0)}.tile.q1{border-color:var(--q1)}.tile.q2{border-color:var(--q2)}.tile.q3{border-color:var(--q3)}
.tile.lock{border-style:dashed;opacity:.6;font-family:var(--f-disp);font-size:11px;color:var(--fg-dim);text-align:center;line-height:1.1}
.tile .lvl{position:absolute;right:1px;bottom:-1px;font-family:var(--f-disp);font-size:11px;line-height:1;color:var(--fg);background:var(--surface-2);padding:0 2px}
.tile .eqm{position:absolute;left:0;top:0;font-family:var(--f-disp);font-size:10px;line-height:1;background:var(--accent);color:var(--accent-ink);padding:1px 2px}
.spk{position:absolute;width:3px;height:3px;background:#fff;box-shadow:0 0 0 1px rgba(242,193,78,.9);animation:spk 1.4s steps(2) infinite}
.spk.a{left:5px;top:6px}.spk.b{right:6px;bottom:9px;animation-delay:.7s}
@keyframes spk{0%,49%{opacity:1}50%,100%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;justify-items:center}
.grid button{background:none;border:0;padding:0}
.q0t{color:var(--q0)}.q1t{color:var(--q1)}.q2t{color:var(--q2)}.q3t{color:var(--q3)}
.iname{font-family:var(--f-disp);font-size:18px;line-height:1.2;font-weight:600}
.irow{display:flex;gap:12px;align-items:center}
.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px}
.bag div{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.bag b{font-family:var(--f-disp);font-size:17px;margin-left:auto}
.lockrow{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:2px solid var(--line)}
.lockrow .lv{font-family:var(--f-disp);font-size:15px;min-width:52px}
.lockrow.open .lv{color:var(--accent-d)}
.lockrow div{flex:1;min-width:0}
.lockrow small{display:block;color:var(--fg-dim);font-size:12.5px}

/* Truhe */
#chest{position:fixed;inset:0;z-index:65;background:var(--dun);color:var(--dun-fg);overflow-y:auto;padding:calc(66px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#chest .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#chest .muted{color:var(--dun-dim)}
#chest h3{font-size:24px}
#chest .pop{animation:pop .5s steps(5) both}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-family:var(--f-disp);font-size:18px}
.loot span{display:flex;align-items:center;gap:5px}
.pickc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--dun-2);border:3px solid #0c0a12;padding:10px}
.pickc.q1{border-color:#3f6fb5}.pickc.q2{border-color:#8a5fc7}.pickc.q3{border-color:#e0ac2f}.pickc.q0{border-color:#8d939b}
.pickc .pt{flex:1;min-width:0}
.pickc .pn{font-family:var(--f-disp);font-size:17px;line-height:1.2;font-weight:600}
.pickc .tile{background:#14111b;border-color:transparent}
.pickc .btn{margin-top:0}
.n0{color:#c9cfd6}.n1{color:#8db4f0}.n2{color:#c9a3ff}.n3{color:#f2c14e}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.rankrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left}
.hero{text-align:center}
.hero .rn{font-family:var(--f-disp);font-size:26px;line-height:1.1;font-weight:600;margin-top:6px}
.hero img.px{margin:0 auto}
.xpbar{height:10px;background:var(--surface-2);border:2px solid var(--frame-d);margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--accent)}
.bosscard{background:var(--dun);color:var(--dun-fg);border:3px solid var(--boss);box-shadow:0 4px 0 var(--frame-d);padding:13px}
.bosscard .eyebrow{color:var(--boss)}
.bosscard .muted{color:var(--dun-dim)}
.bosscard .bn{font-family:var(--f-disp);font-size:24px;line-height:1.1;font-weight:600;margin:2px 0 6px}
.part{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px solid var(--line)}
.part .pt{flex:1;min-width:0}
.part .pl{font-family:var(--f-disp);font-size:14px;color:var(--fg-dim)}
.part.ok .pt{opacity:.55}
.tick{flex:none;font-family:var(--f-disp);font-size:14px;color:var(--accent-d);padding-top:2px}
.statrow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:2px solid var(--line)}
.statrow .sn{flex:1;min-width:0}
.statrow .sn small{display:block;color:var(--fg-dim);font-size:12.5px;line-height:1.35}
.statrow b{font-family:var(--f-disp);font-size:26px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-disp);font-size:14px;color:var(--accent-d);min-width:74px;text-align:right}
.delta.zero{color:var(--fg-dim)}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trophy{background:var(--surface-2);border:2px solid var(--line);padding:8px 6px;text-align:center;min-width:0}
.trophy img.px{margin:0 auto}
.trophy b{display:block;font-family:var(--f-disp);font-size:14px;line-height:1.15;font-weight:600;margin-top:2px}
.trophy span{font-size:11px;color:var(--fg-dim)}
.trophy .tile{margin:0 auto;font-size:20px}
.trophy.unknown{opacity:.5}
.ladder{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:2px solid var(--line)}
.ladder.locked{opacity:.5}
.ladder .lt{flex:1;min-width:0}
.ladder .lt b{display:block;font-family:var(--f-disp);font-size:18px;font-weight:600;line-height:1.15}

.bodywrap{display:flex;gap:4px;justify-content:center;margin-top:4px}
.bodywrap figure{margin:0;flex:1;min-width:0;text-align:center}
.bodywrap figcaption{font-family:var(--f-disp);font-size:13px;color:var(--fg-dim);margin-top:2px}
svg.body{width:100%;height:auto;max-width:200px}
svg.body .sil{fill:var(--m-sil)}
svg.body .m{stroke:var(--surface);stroke-width:1.1;stroke-linejoin:round;cursor:pointer}
svg.body .m.sel{stroke:var(--fg);stroke-width:1.5}
.pick{min-height:42px;margin-top:8px;padding:8px 11px;background:var(--surface-2);border:2px solid var(--line);font-size:14px}
.pick b{font-family:var(--f-disp);font-size:17px;font-weight:600}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--fg-dim)}
.legend i{width:16px;height:10px;display:inline-block}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
th{font-family:var(--f-disp);font-size:13px;color:var(--fg-dim);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field{flex:1;min-width:84px}
label{display:block;font-family:var(--f-disp);font-size:13px;color:var(--fg-dim);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:2px solid var(--line);border-radius:0;padding:7px 9px}
textarea{min-height:70px;resize:vertical;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stat{background:var(--surface-2);border:2px solid var(--line);padding:8px 9px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{display:block;line-height:1.25;margin-top:3px;font-size:12px;color:var(--fg-dim);font-family:var(--f-disp)}
.banner{background:var(--surface);border:3px solid var(--warn);box-shadow:0 4px 0 var(--frame-d);padding:10px 12px;font-size:14px}
.banner b{font-family:var(--f-disp);font-size:17px;display:block;color:var(--warn)}
.banner .btn{margin-top:8px}
.banner.calm{border-color:var(--accent-d)}
.banner.calm b{color:var(--accent-d)}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.sheet .inner{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border:3px solid var(--frame);border-bottom:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:21px;margin-bottom:2px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:2px solid var(--line);padding:8px 10px;margin-top:6px}
.opt.sel{border-color:var(--accent-d);border-width:3px}
.opt small{display:block;color:var(--fg-dim);font-size:12.5px}
.opt>span{flex:1;min-width:0}
.opt>.tile{flex:none}

#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:80;max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);border:3px solid var(--frame-d);padding:9px 14px;font-family:var(--f-disp);font-size:17px;text-align:center;white-space:pre-line}
#rankup{position:fixed;inset:0;z-index:70;background:var(--dun);color:var(--dun-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
#rankup .eyebrow{font-size:16px;letter-spacing:.3em;color:var(--dun-dim)}
#rankup .rn{font-family:var(--f-disp);font-size:44px;line-height:1;font-weight:700}
#rankup img.px{animation:pop .7s steps(6) both}
#rankup .btn{max-width:260px;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><button id="hud" aria-label="Held öffnen"></button></header>
<main id="view"></main>
<div id="timer" hidden>
  <div class="tl"><small>Pause</small><span id="tmL"></span></div>
  <div class="tt" id="tmT">0:00</div>
  <button id="tmP">+30 s</button>
  <button id="tmX" aria-label="Timer beenden">Stopp</button>
</div>
<nav class="tabbar"><div id="tabs" role="tablist">
  <button role="tab" data-t="heute" aria-selected="true">Heute</button>
  <button role="tab" data-t="plan" aria-selected="false">Plan</button>
  <button role="tab" data-t="held" aria-selected="false">Held</button>
  <button role="tab" data-t="verlauf" aria-selected="false">Verlauf</button>
  <button role="tab" data-t="mehr" aria-selected="false">Mehr</button>
</div></nav>
<div id="sheetHost"></div>
<div id="toast" hidden></div>
<div id="chest" hidden></div>
<div id="rankup" hidden></div>

<script>
const HOSTED=!!document.querySelector('link[rel="manifest"]');
/* ================= Plan ================= */
const M = {brust:'Brust',schulter:'Schultern',trizeps:'Trizeps',bizeps:'Bizeps',unterarm:'Unterarme',
 lat:'Latissimus',oberRuecken:'Oberer Rücken und Nacken',unterRuecken:'Unterer Rücken',bauch:'Bauch',
 gesaess:'Gesäß',quad:'Quadrizeps',hamstring:'Beinbeuger',waden:'Waden'};
const O=(n,m,l,h)=>({n,m,l,h});
const X=(id,sets,pause,p,opts)=>({id,sets,pause,p,opts});

const PLAN=[
{id:'A',name:'Oberkörper · vertikal',ex:[
 X('a1','4 × 6–8','2–3 min',150,[
   O('Klimmzüge, Obergriff',['lat','bizeps','unterarm'],['3 s Absenkphase','3 s + volle Streckung unten','+2,5 kg','+5 kg','+7,5 kg','+10 kg','+12,5 kg','+15 kg'],'Brust zur Stange, 3 s kontrolliert ablassen.'),
   O('Klimmzüge, neutraler Griff',['lat','bizeps','unterarm'],['3 s Absenkphase','+2,5 kg','+5 kg','+7,5 kg','+10 kg'],'Handflächen zueinander, das schont die Schulter.'),
   O('Archer Pull-Ups',['lat','bizeps','unterarm'],['assistiert','freie Wiederholungen','mit Pause seitlich'],'Ein Arm zieht, der andere stützt gestreckt.')]),
 X('a2','3 × 6–10','2–3 min',150,[
   O('Dips an der Stange',['brust','trizeps','schulter'],['ROM 1 · schmerzfreie Tiefe','ROM 2 · ca. 2 cm tiefer','ROM 3 · ca. 4 cm tiefer','ROM 4 · Oberarm fast waagerecht','voller Bewegungsweg','+5 kg','+10 kg','+15 kg'],'Nur bis zur markierten Tiefe. Zieht oder sticht es, eine Stufe zurück.'),
   O('Negative Dips',['brust','trizeps','schulter'],['5 s abwärts','8 s abwärts'],'Oben einsteigen, langsam bis zur schmerzfreien Tiefe.'),
   O('Liegestütze, Füße erhöht',['brust','trizeps','schulter'],['Füße auf Stuhl','Füße höher','mit Rucksack'],'Körper eine Linie, Ellbogen etwa 45°.')]),
 X('a3','3 × 10–15','90 s',90,[
   O('Rudern am Seil, Füße erhöht',['oberRuecken','lat','bizeps'],['Füße erhöht','Körper waagerecht','1 s Pause oben','einarmig'],'Körper bleibt eine Linie, Schulterblätter führen.'),
   O('Kurzhantelrudern, einarmig',['oberRuecken','lat','bizeps'],['10 kg','12,5 kg','15 kg','17,5 kg','20 kg'],'Ellbogen zur Hüfte, Rumpf dreht nicht mit.')]),
 X('a4','3 × 8–12','90 s',90,[
   O('Pike Push-Ups, Füße erhöht',['schulter','trizeps'],['Füße auf Stuhl','Hände abgesenkt (Deficit)','Füße höher','Handstand-Push-Up negativ'],'Hüfte hoch, Kopf zwischen den Händen ablegen.'),
   O('Überkopfdrücken, Kurzhanteln',['schulter','trizeps'],['2 × 8 kg','2 × 10 kg','2 × 12,5 kg','2 × 15 kg','2 × 17,5 kg'],'Rippen unten halten, kein Hohlkreuz.')]),
 X('a5','3 × 12–15','60 s',60,[
   O('Curls am Seil',['bizeps','unterarm'],['Körper schräg','Körper waagerechter','einarmig'],'Ellbogen bleiben vorn, letzter Satz bis knapp ans Versagen.'),
   O('Kurzhantel-Curls',['bizeps','unterarm'],['2 × 8 kg','2 × 10 kg','2 × 12,5 kg','2 × 15 kg'],'Kein Schwung aus der Hüfte.')]),
 X('a6','3 × 8–12','60 s',60,[
   O('Hängendes Beinheben',['bauch'],['Knie angewinkelt','Beine gestreckt','Zehen zur Stange','mit Pause oben'],'Becken einrollen, nicht schwingen.'),
   O('Hollow Hold',['bauch'],['20 s','30 s','45 s','60 s'],'Unterer Rücken bleibt am Boden.')])
]},
{id:'B',name:'Unterkörper · Core',ex:[
 X('b1','4 × 10–12 je Seite','2 min',120,[
   O('Bulgarian Split Squat',['quad','gesaess'],['8 kg','8 kg · 3 s abwärts','12 kg','16 kg','2 × 10 kg','2 × 12,5 kg','2 × 15 kg','2 × 20 kg'],'3 s abwärts, vorderes Knie über dem Fuß.'),
   O('Ausfallschritte rückwärts',['quad','gesaess'],['ohne Gewicht','8 kg','2 × 10 kg','2 × 15 kg'],'Großer Schritt zurück, Oberkörper aufrecht.')]),
 X('b2','3 × 15–20','90 s',90,[
   O('Goblet Squat',['quad','gesaess'],['8 kg','12 kg','16 kg','20 kg','3 s abwärts + 1 s unten'],'Tiefe Hocke, Fersen bleiben am Boden.'),
   O('Kniebeuge mit Kurzhanteln',['quad','gesaess'],['2 × 10 kg','2 × 15 kg','2 × 20 kg'],'Hanteln seitlich, Brust aufrecht.')]),
 X('b3','3 × 10–12 je Seite','90 s',90,[
   O('Einbeiniges Kreuzheben',['hamstring','gesaess','unterRuecken'],['8 kg','12 kg','16 kg','20 kg','2 × 15 kg'],'Rücken gerade, Dehnung in der Beinrückseite suchen.'),
   O('Rumänisches Kreuzheben, beidbeinig',['hamstring','gesaess','unterRuecken'],['2 × 10 kg','2 × 15 kg','2 × 20 kg','3 s abwärts'],'Hüfte nach hinten, Hanteln nah am Bein.')]),
 X('b4','3 × 5–8','2 min',120,[
   O('Nordic Curls, Absenkphase',['hamstring'],['kleiner Weg, früh abfangen','halber Weg','drei Viertel','voller Weg','ohne Abfangen hoch'],'Füße fixieren, früh mit den Händen abfangen.'),
   O('Beinbeuger mit Handtuch',['hamstring'],['beidbeinig','einbeinig'],'Fersen auf dem Handtuch, Hüfte oben halten.')]),
 X('b5','3 × 15–20 je Seite','60 s',60,[
   O('Wadenheben einbeinig, Stufe',['waden'],['Körpergewicht','8 kg','16 kg','20 kg','1 s Pause oben'],'Unten dehnen, oben 1 s halten.')]),
 X('b6','3 × 30 s','45 s',45,[
   O('Hollow Hold',['bauch'],['20 s','30 s','45 s','60 s'],'Unterer Rücken bleibt am Boden.'),
   O('Ab Rollout mit Hantel',['bauch'],['halber Weg','dreiviertel','voller Weg'],'Becken eingerollt, nicht ins Hohlkreuz fallen.')])
]},
{id:'C',name:'Oberkörper · horizontal',ex:[
 X('c1','4 × 6–10 je Seite','2 min',120,[
   O('Archer Push-Ups',['brust','trizeps','schulter'],['Hände erhöht','am Boden','Füße erhöht','mit Rucksack'],'Last auf den gebeugten Arm, der andere bleibt gestreckt.'),
   O('Liegestütze, Hände abgesenkt',['brust','trizeps','schulter'],['Bücher 5 cm','Bücher 10 cm','+ Rucksack 5 kg','+ Rucksack 10 kg'],'Die Brust taucht zwischen die Hände.')]),
 X('c2','4 × 8–12 je Seite','2 min',120,[
   O('Rudern am Seil, einarmig',['oberRuecken','lat','bizeps'],['schräg','waagerechter','1 s Pause oben','Füße erhöht'],'Oben 1 s halten, Rumpf nicht mitdrehen.'),
   O('Kurzhantelrudern, einarmig',['oberRuecken','lat','bizeps'],['12,5 kg','15 kg','17,5 kg','20 kg'],'Ellbogen zur Hüfte, Rumpf dreht nicht mit.')]),
 X('c3','3 × 6–10','2 min',120,[
   O('Klimmzüge, Untergriff',['lat','bizeps'],['volle Streckung unten','3 s abwärts','+2,5 kg','+5 kg','+7,5 kg','+10 kg'],'Voller Weg, unten die Arme strecken.')]),
 X('c4','3 × 10–15','90 s',90,[
   O('Diamond Push-Ups, Füße erhöht',['trizeps','brust'],['Füße am Boden','Füße auf Stuhl','+ Rucksack 5 kg','+ Rucksack 10 kg'],'Ellbogen eng am Körper.'),
   O('Trizepsdrücken am Seil',['trizeps'],['schräg','waagerechter','einarmig'],'Ellbogen zeigen nach vorn, nur der Unterarm bewegt sich.')]),
 X('c5','3 × 15–20','60 s',60,[
   O('Face Pulls am Seil',['schulter','oberRuecken'],['schräg','waagerechter','1 s Pause','einarmig'],'Zur Stirn ziehen, Ellbogen hoch.')]),
 X('c6','3 × 10–12 je Seite','90 s',90,[
   O('Überkopfdrücken, einarmig',['schulter','trizeps'],['8 kg','10 kg','12,5 kg','15 kg','17,5 kg','20 kg'],'Rumpf fest, kein Hohlkreuz.')]),
 X('c7','3 × 45 s','45 s',45,[
   O('Unterarmstütz',['bauch'],['45 s','60 s','90 s','mit Beinheben'],'Gesäß anspannen.'),
   O('Pallof Press mit Band',['bauch'],['leichtes Band','mittleres Band','starkes Band'],'Arme nach vorn strecken, nicht mitdrehen.')])
]},
{id:'D',name:'Unterkörper · Hüfte',ex:[
 X('d1','4 × 15–20','90 s',90,[
   O('Kettlebell Swings',['gesaess','hamstring','unterRuecken'],['8 kg','12 kg','16 kg','20 kg','24 kg'],'Die Hüfte schnappt, die Arme bleiben locker.'),
   O('Kreuzheben mit Kurzhanteln',['gesaess','hamstring','unterRuecken'],['2 × 15 kg','2 × 20 kg','3 s abwärts'],'Rücken gerade, aus der Hüfte aufrichten.')]),
 X('d2','4 × 6–10 je Seite','2 min',120,[
   O('Einbeinige Kniebeuge auf Box',['quad','gesaess'],['hohe Box','mittlere Box','niedrige Box','sehr niedrig','freier Pistol Squat'],'Kontrolliert absetzen, nicht fallen lassen.'),
   O('Split Squat erhöht',['quad','gesaess'],['ohne Gewicht','8 kg','2 × 12,5 kg'],'Vorderfuß erhöht, tief absenken.')]),
 X('d3','3 × 10–12 je Seite','90 s',90,[
   O('Step-Ups auf hohe Stufe',['quad','gesaess'],['ohne Gewicht','8 kg','2 × 10 kg','2 × 15 kg','höhere Stufe'],'Die ganze Arbeit kommt aus dem oberen Bein, nicht abdrücken.')]),
 X('d4','3 × 12–15 je Seite','90 s',90,[
   O('Einbeinige Hüftstreckung',['gesaess','hamstring'],['Körpergewicht','8 kg','16 kg','2 s Pause oben','20 kg'],'Oben 2 s halten, Gesäß fest.')]),
 X('d5','3 × 8–10','90 s',90,[
   O('Sprungkniebeugen',['quad','waden'],['Körpergewicht','mit Pause unten','einbeinig flach'],'Weich landen. Weglassen, wenn die Knie meckern.'),
   O('Wadenheben einbeinig',['waden'],['Körpergewicht','8 kg','16 kg','20 kg'],'Unten dehnen, oben 1 s halten.')]),
 X('d6','3 × 30–40 s je Seite','45 s',45,[
   O('Seitstütz',['bauch'],['30 s','45 s','60 s','mit Beinheben'],'Hüfte hoch halten.')])
]}];

const REGION={A:'o',C:'o',B:'u',D:'u'};
const REGION_NAME={o:'Oberkörper',u:'Unterkörper'};
const CORE=['a6','b6','c7','d6'];
const catOf=id=>CORE.includes(id)?'ker':(id[0]==='a'||id[0]==='c')?'str':'sta';
const STATN={str:'Stärke',sta:'Standfestigkeit',ker:'Kern',aus:'Ausdauer'};
const STATH={str:'Stufen im Oberkörper, Bestwerte bei Klimmzügen, Liegestützen und Dips',
 sta:'Stufen im Unterkörper, Bestwert beim Split Squat',ker:'Stufen bei den Rumpfübungen',
 aus:'Bestzeit auf 3 km und längste Strecke'};

/* ================= Spielregeln ================= */
const XP={sess:100,run:50,steps:10,stretch:10,week:100,weekStep:20,weekCap:200,stage:150,best:200,deload:150};
const RANKS=[
 {lvl:1,code:'E',name:'Anwärter',title:'E-Rang · Anwärter'},
 {lvl:4,code:'D',name:'Jäger',title:'D-Rang · Jäger'},
 {lvl:8,code:'C',name:'Kämpfer',title:'C-Rang · Kämpfer'},
 {lvl:12,code:'B',name:'Veteran',title:'B-Rang · Veteran'},
 {lvl:16,code:'A',name:'Elite',title:'A-Rang · Elite'},
 {lvl:20,code:'S',name:'Meister',title:'S-Rang · Meister'},
 {lvl:25,code:'',name:'Grenzbrecher',title:'Grenzbrecher'},
 {lvl:30,code:'',name:'Erwachter',title:'Erwachter'}];
const TESTS={pull:{n:'Klimmzüge',u:'Wdh',stat:'str',per:1},push:{n:'Liegestütze',u:'Wdh',stat:'str',per:2},
 dip:{n:'Dips an der Stange',u:'Wdh, schmerzfreie Tiefe',stat:'str',per:1},split:{n:'Bulgarian Split Squat, 8 kg',u:'Wdh je Seite',stat:'sta',per:2}};
const BASE={pull:10,push:30,dip:7,split:15};
const c=Math.ceil;
const km=v=>String(v).replace('.',',');

/* Rangprüfungen: Anforderungen richten sich nach den Bestwerten beim Antritt. */
const EXAMS=[null,
 {days:3,xp:500,name:'Prüfung des Jägers',parts:b=>[
   {l:'Kraft',t:`In einer Einheit ${c(2.5*b.pull)} Klimmzüge und ${c(2.5*b.push)} Liegestütze, jeweils in höchstens 5 Sätzen.`}]},
 {days:5,xp:700,name:'Prüfung des Kämpfers',parts:b=>[
   {l:'Kraft',t:`${c(3*b.pull)} Klimmzüge in höchstens 5 Sätzen, 2 Minuten Pause dazwischen.`},
   {l:'Ausdauer',t:`${km(Math.max(4,c(b.long+1)))} km am Stück laufen, ohne Gehpause.`}]},
 {days:7,xp:900,name:'Prüfung des Veteranen',parts:b=>[
   {l:'Kraft',t:`In einer Einheit ${c(3*b.pull)} Klimmzüge und ${c(3*b.push)} Liegestütze, jeweils in höchstens 5 Sätzen.`},
   {l:'Standfestigkeit',t:`${c(3*b.split)} Bulgarian Split Squats je Seite mit deinem aktuellen Gewicht, in höchstens 4 Sätzen.`},
   {l:'Ausdauer',t:`${km(Math.max(5,c(b.long+1)))} km am Stück laufen, ohne Gehpause.`}]},
 {days:7,xp:1100,name:'Prüfung der Elite',parts:b=>[
   {l:'Durchbruch',auto:1,t:'Verbessere in diesem Zeitraum mindestens einen Bestwert: eine Kraftprobe, deine 3-km-Zeit oder deine längste Strecke.'},
   {l:'Standfestigkeit',t:`${c(3.5*b.split)} Bulgarian Split Squats je Seite in höchstens 4 Sätzen, danach 5 Minuten Wandsitzen in höchstens 4 Abschnitten.`},
   {l:'Ausdauer',t:`${km(Math.max(6,c(b.long+1)))} km am Stück laufen, ohne Gehpause.`}]},
 {days:10,xp:1500,name:'Prüfung des Meisters',parts:b=>[
   {l:'Kraft',t:`In einer Einheit ${c(4*b.pull)} Klimmzüge, ${c(4*b.push)} Liegestütze und ${b.dipsOK?c(3*b.dip)+' Dips über den vollen Bewegungsweg':'60 Diamond Push-Ups'}, jeweils in höchstens 6 Sätzen.`},
   {l:'Standfestigkeit',t:`${c(4*b.split)} Bulgarian Split Squats je Seite in höchstens 5 Sätzen, danach 5 einbeinige Kniebeugen je Seite auf deiner aktuellen Stufe.`},
   {l:'Ausdauer',t:`${km(Math.max(8,c(b.long+1)))} km am Stück laufen, ohne Gehpause.`}]},

const KEY='trainingslog-v1',BKEY='trainingslog-kopie',VKEY='trainingslog-version',APP_V=3;
/* Sicherheitsnetz: Vor dem ersten Start einer neuen Fassung wandert der unveränderte alte Stand in eine eigene Ablage.
   Das Trainingsprotokoll (KEY) und der Spielstand (GKEY) liegen getrennt, das Spiel schreibt nie ins Protokoll. */
(function(){try{
  const old=localStorage.getItem(VKEY),raw=localStorage.getItem(KEY);
  if(old!==String(APP_V)){
    if(raw)localStorage.setItem(BKEY,JSON.stringify({von:old||'2',am:iso(new Date()),s:raw,g:localStorage.getItem('trainingslog-spiel')}));
    localStorage.setItem(VKEY,String(APP_V));}
}catch(e){}})();
function readCopy(){try{const r=localStorage.getItem(BKEY);if(!r)return null;const o=JSON.parse(r);if(!o||!o.s)return null;
  return {tag:fmtDate(o.am)+parse(o.am).getFullYear(),raw:o};}catch(e){return null;}}
const DEF=()=>({ex:{},log:[],runs:[],weight:[],steps:[],stretch:[],bests:[],ev:[],lastDeload:null,lastTest:null,start:null,
 deload:null,pause:null,pauses:[],boss:{cur:null,next:null,done:[],fled:[]},exam:{cur:null,passed:0,failed:[]},
 goal:{s:4,r:2},live:null,lastBackup:null,seenLvl:1,v:3});
let S=migrate(load());

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return {};
}
function migrate(p){
  const d=DEF(),s=Object.assign({},d,p||{});
  s.boss=Object.assign({},d.boss,s.boss||{});s.exam=Object.assign({},d.exam,s.exam||{});s.goal=Object.assign({},d.goal,s.goal||{});
  ['log','runs','weight','steps','stretch','bests','ev','pauses'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  ['done','fled'].forEach(k=>{if(!Array.isArray(s.boss[k]))s.boss[k]=[];});
  if(!Array.isArray(s.exam.failed))s.exam.failed=[];
  const t0=s.start||today();
  /* Startwerte aus dem Gespräch: 10 Klimmzüge, 30 Liegestütze, 7 Dips, 15 Split Squats */
  Object.keys(BASE).forEach(k=>{if(!s.bests.some(b=>b.k===k))s.bests.unshift({date:t0,k,v:BASE[k],base:true});});
  /* Stufen, die schon vor dem Punktesystem erreicht waren, zählen rückwirkend */
  Object.keys(s.ex||{}).forEach(id=>{const st=s.ex[id];
    for(let l=1;l<=(st.lvl||0);l++)if(!s.ev.some(e=>e.t==='stage'&&e.ex===id&&e.opt===(st.opt||0)&&e.lvl===l))
      s.ev.push({date:st.since||t0,t:'stage',ex:id,opt:st.opt||0,lvl:l,xp:XP.stage});});
  s.v=3;return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function exState(id){if(!S.ex[id])S.ex[id]={opt:0,lvl:0,since:today()};return S.ex[id];}
function findEx(id){for(const s of PLAN)for(const e of s.ex)if(e.id===id)return e;return null;}
function curOpt(e){return e.opts[Math.min(exState(e.id).opt,e.opts.length-1)];}
function curLvl(e){const o=curOpt(e);return o.l[Math.min(exState(e.id).lvl,o.l.length-1)];}
function sessName(id){const p=PLAN.find(x=>x.id===id);return p?p.name:'';}

const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function today(){return iso(new Date());}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const[a,b,cc]=s.split('-').map(Number);return new Date(a,b-1,cc);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function addDays(ds,n){const d=parse(ds);d.setDate(d.getDate()+n);return iso(d);}
function fmtDate(s){const d=parse(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function dayName(s){return DAYS[(parse(s).getDay()+6)%7];}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
function weekKey(ds){return iso(mondayOf(parse(ds)));}
function ago(n){return n===null?'noch nie':n===0?'heute':n===1?'gestern':'vor '+n+' T';}
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;};
function parseTime(v){v=String(v).trim();if(!v)return null;if(v.includes(':')){const p=v.split(':');const a=num(p[0]),b=num(p[1]||0);return a===null?null:a+(b||0)/60;}return num(v);}
function fmtTime(min){let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return m+':'+String(s).padStart(2,'0');}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nf=n=>Math.round(n).toLocaleString('de-DE');
const $=s=>document.querySelector(s);
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}

/* ================= Abgeleitete Werte ================= */
function lastOf(id){let b=null;for(const l of S.log)if(l.s===id&&(!b||l.date>b))b=l.date;return b;}
function regionsNear(ds){const s=new Set();for(const l of S.log){const n=daysBetween(l.date,ds);if(n===0||n===1)s.add(REGION[l.s]);}return s;}
function suggest(){
  const order=PLAN.map((p,i)=>({p,i,d:lastOf(p.id)||''})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.i-b.i);
  const near=regionsNear(today());
  const free=order.find(o=>!near.has(REGION[o.p.id]));
  return (free||order[0]).p;
}
function lastTrained(mus){
  let best=null;
  for(const L of S.log){
    const sess=PLAN.find(p=>p.id===L.s);if(!sess)continue;
    for(const e of sess.ex){const st=S.ex[e.id];const o=e.opts[st?Math.min(st.opt,e.opts.length-1):0];
      if(o.m.includes(mus)){if(!best||L.date>best)best=L.date;}}
  }
  return best;
}
function heat(mus){const d=lastTrained(mus);if(!d)return null;const n=daysBetween(d,today());
  if(n<=1)return 4;if(n<=3)return 3;if(n<=5)return 2;if(n<=8)return 1;return 0;}
function curWeight(){if(!S.weight.length)return 96;return [...S.weight].sort((a,b)=>a.date<b.date?-1:1).pop().kg;}
function movAvg(arr,win){const out=[];for(let i=0;i<arr.length;i++){const from=parse(arr[i].date);let s=0,n=0;
  for(let j=0;j<=i;j++){if((from-parse(arr[j].date))/86400000<win){s+=arr[j].kg;n++;}}out.push({date:arr[i].date,kg:s/n});}return out;}

function paused(){return !!S.pause;}
function weekPaused(k){const end=addDays(k,6);
  return S.pauses.some(p=>p.from<=end&&p.to>=k)||(S.pause&&S.pause.since<=end);}
function weekMap(){const w={};const g=k=>w[k]||(w[k]={s:0,r:0});
  S.log.forEach(l=>g(weekKey(l.date)).s++);S.runs.forEach(r=>g(weekKey(r.date)).r++);return w;}
function xpCalc(){
  const w=weekMap();let sess=0,run=0,bonus=0,streak=0,bestStreak=0;
  for(const k in w){sess+=Math.min(w[k].s,4)*XP.sess;run+=Math.min(w[k].r,3)*XP.run;}
  const steps=S.steps.filter(x=>x.n>=10000).length*XP.steps,stretch=new Set(S.stretch).size*XP.stretch;
  if(S.start){const cur=mondayOf(parse(S.start));const end=weekKey(today());
    for(let guard=0;guard<600;guard++){const k=iso(cur);const x=w[k]||{s:0,r:0};const met=x.s>=S.goal.s&&x.r>=S.goal.r;
      if(met){streak++;bonus+=XP.week+Math.min(XP.weekCap,XP.weekStep*(streak-1));}
      else if(k!==end&&!weekPaused(k))streak=0;
      bestStreak=Math.max(bestStreak,streak);
      if(k>=end)break;cur.setDate(cur.getDate()+7);}}
  const led={stage:0,best:0,boss:0,exam:0,deload:0};
  S.ev.forEach(e=>{led[e.t]=(led[e.t]||0)+(e.xp||0);});
  const total=sess+run+steps+stretch+bonus+led.stage+led.best+led.boss+led.exam+led.deload;
  return {total,sess,run,steps,stretch,bonus,streak,bestStreak,led};
}
const cum=n=>500*(n-1)+75*(n-1)*(n-2);
function levelOf(xp){let n=1;while(xp>=cum(n+1))n++;return n;}
function rankIdx(){return Math.min(S.exam.passed||0,RANKS.length-1);}
function examReady(lvl){const nx=rankIdx()+1;return nx<RANKS.length&&lvl>=RANKS[nx].lvl&&!S.exam.cur;}

function bestAt(k,ds){let b=null;S.bests.forEach(x=>{if(x.k===k&&x.date<=ds&&(b===null||x.v>b))b=x.v;});return b;}
function baseOf(k){const f=S.bests.find(x=>x.k===k);return f?f.v:BASE[k];}
function curBest(k){const b=bestAt(k,'9999-12-31');return b===null?BASE[k]:b;}
function runInfo(ds){let long=0,first=null,best=null;
  S.runs.forEach(r=>{if(r.date>ds)return;long=Math.max(long,r.km);
    if(r.km>=3){const p=r.min/r.km;if(first===null)first=p;if(best===null||p<best)best=p;}});
  return {long,first,best};}
function statsAt(ds){
  const st={str:10,sta:10,ker:10,aus:10};
  S.ev.forEach(e=>{if(e.t==='stage'&&e.date<=ds){const k=catOf(e.ex);st[k]+=k==='ker'?2:1;}});
  Object.keys(TESTS).forEach(k=>{const b=bestAt(k,ds);if(b!==null)st[TESTS[k].stat]+=Math.max(0,Math.floor((b-baseOf(k))/TESTS[k].per));});
  const r=runInfo(ds);
  if(r.long>3)st.aus+=Math.floor((r.long-3)/0.5);
  if(r.first!==null)st.aus+=Math.max(0,Math.floor((r.first-r.best)*60/5));
  return st;
}
function snapshot(){const r=runInfo(today());
  return {pull:curBest('pull'),push:curBest('push'),dip:curBest('dip'),split:curBest('split'),long:r.long,bestPace:r.best,
    dipsOK:S.ev.some(e=>e.t==='stage'&&e.ex==='a2'&&e.opt===0&&e.lvl>=4)};}

/* ================= Aktionen ================= */
let LASTXP=0,CHSEEN=0;
function commit(label){
  tick();gameTick();save();saveG();
  const x=xpCalc(),diff=x.total-LASTXP;LASTXP=x.total;
  const lvl=levelOf(x.total);let msg=label||'';
  if(diff>0)msg+=(msg?' · ':'')+'+'+nf(diff)+' XP';
  if(lvl>S.seenLvl){S.seenLvl=lvl;save();msg+=(msg?'\n':'')+'Level '+lvl+' erreicht';
    if(examReady(lvl))msg+='\nRangprüfung bereit';}
  if(msg)toast(msg);
  render();
  /* Neue Truhe seit dem letzten Mal: gleich aufmachen */
  if(G.stats.chests>CHSEEN){CHSEEN=G.stats.chests;if(G.chests.length)openChest();}
}
let TOASTT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(TOASTT);TOASTT=setTimeout(()=>{t.hidden=true;},3200);}

function addLog(ds,id,note){S.log.push({date:ds,s:id,note:note||''});if(!S.start||ds<S.start)S.start=ds;}
function addRun(ds,kmv,min){
  const before=runInfo('9999-12-31');
  S.runs=S.runs.filter(x=>x.date!==ds);S.runs.push({date:ds,km:kmv,min,kg:curWeight()});
  S.runs.sort((a,b)=>a.date<b.date?-1:1);if(!S.start||ds<S.start)S.start=ds;
  const out=[];
  if(kmv>=3&&before.best!==null&&min/kmv<before.best-1e-9){S.ev.push({date:ds,t:'best',k:'pace',xp:XP.best,label:'Bestzeit auf 3 km'});out.push('Neue Bestzeit');}
  if(before.long>=3&&kmv>=before.long+0.5){S.ev.push({date:ds,t:'best',k:'dist',xp:XP.best,label:'Längste Strecke: '+km(kmv)+' km'});out.push('Längste Strecke');}
  return out;
}
function addBest(k,v){const prev=curBest(k);S.bests.push({date:today(),k,v});S.lastTest=today();
  if(v>prev){S.ev.push({date:today(),t:'best',k,xp:XP.best,label:'Bestwert '+TESTS[k].n+': '+v});return true;}return false;}
function setLevel(e,lvl){const st=exState(e.id);let n=0;
  for(let l=1;l<=lvl;l++)if(!S.ev.some(x=>x.t==='stage'&&x.ex===e.id&&x.opt===st.opt&&x.lvl===l)){
    S.ev.push({date:today(),t:'stage',ex:e.id,opt:st.opt,lvl:l,xp:XP.stage});n++;}
  st.lvl=lvl;st.since=today();return n;}
function setPause(on){
  if(on&&!S.pause){S.pause={since:today()};}
  else if(!on&&S.pause){const d=daysBetween(S.pause.since,today());S.pauses.push({from:S.pause.since,to:today()});S.pause=null;
    if(d>0){if(S.boss.cur)S.boss.cur.until=addDays(S.boss.cur.until,d);if(S.boss.next)S.boss.next=addDays(S.boss.next,d);
      if(S.exam.cur)S.exam.cur.until=addDays(S.exam.cur.until,d);if(S.deload)S.deload.from=addDays(S.deload.from,d);}}
}
function startExam(){const i=rankIdx()+1,E=EXAMS[i],b=snapshot();
  S.exam.cur={rank:i,from:today(),until:addDays(today(),E.days),xp:E.xp,name:E.name,
    parts:E.parts(b).map(p=>({l:p.l,t:p.t,auto:p.auto||0,done:null}))};}
function checkExam(){const X2=S.exam.cur;if(!X2)return false;
  X2.parts.forEach(p=>{if(p.auto&&!p.done){const ks=new Set(S.ev.filter(e=>e.t==='best'&&e.date>=X2.from&&e.date<=X2.until).map(e=>e.k));
    if(ks.size>=p.auto)p.done=today();}});
  if(X2.parts.every(p=>p.done)){S.exam.passed=X2.rank;S.ev.push({date:today(),t:'exam',xp:X2.xp,label:X2.name});S.exam.cur=null;lootExam(X2.rank);return true;}
  return false;}
function spawnBoss(){const b=snapshot();const recent=[...S.boss.done,...S.boss.fled].sort((a,x)=>a.date<x.date?-1:1).slice(-4).map(x=>x.id);
  let pool=BOSSES.filter(B=>(!B.ok||B.ok(b))&&!recent.includes(B.id));if(!pool.length)pool=BOSSES.filter(B=>!B.ok||B.ok(b));
  const B=pool[rnd(0,pool.length-1)];
  S.boss.cur={id:B.id,n:B.n,text:B.t(b),sw:B.sw,xp:B.xp,from:today(),until:addDays(today(),rnd(5,7))};}
function tick(){
  const t=today(),B=S.boss;
  if(S.live&&S.live.date!==t)S.live=null;
  if(S.deload&&!paused()&&daysBetween(S.deload.from,t)>=7){S.ev.push({date:t,t:'deload',xp:XP.deload,label:'Deload-Woche eingehalten'});S.lastDeload=t;S.deload=null;}
  if(B.cur&&!paused()&&t>B.cur.until){B.fled.push({id:B.cur.id,date:t});B.cur=null;B.next=addDays(t,rnd(10,14));}
  if(S.exam.cur&&!paused()&&t>S.exam.cur.until){S.exam.failed.push({rank:S.exam.cur.rank,date:t});S.exam.cur=null;}
  if(!B.next&&S.start)B.next=addDays(S.start,rnd(7,10));
  if(!B.cur&&B.next&&t>=B.next&&!paused()&&!S.deload&&!S.exam.cur&&S.log.length>=3)spawnBoss();
  if(checkExam())showRankUp(S.exam.passed);
}

let T=null,AC=null,WL=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(AC)[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
function startTimer(sec,label){stopTimer();T={end:Date.now()+sec*1000,label,done:false};ensureAudio();wake(true);
  const bar=$('#timer');bar.hidden=false;bar.classList.remove('done');T.int=setInterval(drawTimer,250);drawTimer();}
function drawTimer(){if(!T)return;const left=Math.ceil((T.end-Date.now())/1000),bar=$('#timer');
  $('#tmL').textContent=T.label;

const SPCACHE=new Map();
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function paint(ctx,rows,pal,ox,oy){
  rows.forEach((row,y)=>{for(let x=0;x<row.length;x++){const ch=row[x];if(ch==='.')continue;ctx.fillStyle=pal[ch]||PAL0[ch]||'#ff00ff';ctx.fillRect(ox+x,oy+y,1,1);}});
}
/* Schein um den Umriss: zwei Ringe, der äußere schwächer */
function addHalo(cv,col){
  const w=cv.width,h=cv.height,ctx=cv.getContext('2d'),c=hexRGB(col);
  [0.6,0.28].forEach(alpha=>{const d=ctx.getImageData(0,0,w,h),a=d.data,add=[];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(a[(y*w+x)*4+3])continue;
      if((x>0&&a[(y*w+x-1)*4+3])||(x<w-1&&a[(y*w+x+1)*4+3])||(y>0&&a[((y-1)*w+x)*4+3])||(y<h-1&&a[((y+1)*w+x)*4+3]))add.push(x,y);}
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha})`;for(let i=0;i<add.length;i+=2)ctx.fillRect(add[i],add[i+1],1,1);});
}
function sprURL(key,w,h,draw,halo){
  if(SPCACHE.has(key))return SPCACHE.get(key);
  let url='';
  try{const pad=halo?2:0,cv=document.createElement('canvas');cv.width=w+pad*2;cv.height=h+pad*2;
    const ctx=cv.getContext('2d');draw(ctx,pad,pad);if(halo)addHalo(cv,halo);url=cv.toDataURL();}catch(e){}
  SPCACHE.set(key,url);return url;
}
/* Einzelne Grafik. opt: pal (Umfärbung), halo (Farbe des Scheins), size (Kantenlänge in px), cls */
function spr(name,opt){
  opt=opt||{};const rows=SP[name];if(!rows)return '';
  const w=rows[0].length,h=rows.length,pal=opt.pal||{},pad=opt.halo?2:0;
  const key=name+'|'+JSON.stringify(pal)+'|'+(opt.halo||'');
  const url=sprURL(key,w,h,(ctx,ox,oy)=>paint(ctx,rows,pal,ox,oy),opt.halo);
  const size=opt.size||48,k=size/Math.max(w,h);
  return `<img class="px ${opt.cls||''}" src="${url}" width="${Math.round((w+pad*2)*k)}" height="${Math.round((h+pad*2)*k)}" alt="" style="${pad?'margin:'+(-pad*k).toFixed(1)+'px':''}">`;
}
function badge(i,size){const p=RANKP[i];return spr('rang'+i,{pal:{m:p[0],M:p[1]},size:size||32});}
function emblem(i,size){return badge(i,size);}

let G=migrateG(loadG());

/* ----- Gegenstände ----- */
function getItem(id){return id?G.inv.find(i=>i.id===id)||null:null;}
function itemName(it){
  const A=ARTS[it.art],F=it.src?FORMS[it.src]:null,r=rng(it.seed||1),gen=F?F.gen:'des Wanderers';
  if(it.rar===0)return A.common;
  if(it.rar===1)return A.n+' '+gen;
  const pre=pickR(NAMEP[it.src||'none'],r);let suf=pickR(NAMES[A.sfx],r);
  if(suf.toLowerCase()===pre.toLowerCase())suf=NAMES[A.sfx][0];
  const own=pre+suf;
  return it.rar===2?own+', '+A.n+' '+gen:own+', '+pickR(EPI[it.src||'none'],r);
}
function mkItem(art,rar,src,extra){
  const it=Object.assign({id:G.nextId++,art,rar,lvl:curLevel(),src:src||null,up:0,st:[],seed:Math.floor(Math.random()*1e9)},extra||{});
  if(!it.name)it.name=itemName(it);return it;
}
function itemVal(it){const A=ARTS[it.art];return Math.round((8+3*it.lvl)*RARM[it.rar]*SLOTW[A.slot]*(A.two?1.6:1)*(1+0.08*(it.up||0)));}
function sellPrice(it){return SELL[it.rar];}

function itemIcon(it,size){return spr(ARTS[it.art].spr,{pal:itemPal(it),size,halo:it.rar>=2?RARC[it.rar]:null});}
function isEq(it){return SLOTS.some(s=>G.eq[s]===it.id);}
function eqSlotOf(it){return SLOTS.find(s=>G.eq[s]===it.id)||null;}
/* Einzelstücke von Weltbossen und Prüfungen sind unverkäuflich und belegen deshalb keinen Inventarplatz */
function bagCount(){return G.inv.filter(i=>!isEq(i)&&!i.uniq).length;}
function gearScore(){return SLOTS.reduce((s,k)=>{const it=getItem(G.eq[k]);return s+(it?itemVal(it):0);},0);}
function slotFor(it){const s=ARTS[it.art].slot;if(s!=='ring')return s;return !G.eq.ring1?'ring1':!G.eq.ring2?'ring2':'ring1';}
function equip(it,slot){
  slot=slot||slotFor(it);const A=ARTS[it.art],was=eqSlotOf(it),main=getItem(G.eq.main),out=[];
  if(G.eq[slot]&&G.eq[slot]!==it.id)out.push(getItem(G.eq[slot]));
  if(A.two&&G.eq.off)out.push(getItem(G.eq.off));
  if(slot==='off'&&main&&ARTS[main.art].two)out.push(main);
  const back=out.filter(o=>o&&!o.uniq).length;
  if(back&&bagCount()-(was||it.uniq?0:1)+back>G.cap)return 'Inventar voll. Erst ein Stück verkaufen.';
  if(was)G.eq[was]=null;
  if(A.two)G.eq.off=null;
  if(slot==='off'&&main&&ARTS[main.art].two)G.eq.main=null;
  G.eq[slot]=it.id;return null;
}
function unequip(slot){const it=getItem(G.eq[slot]);if(!it){G.eq[slot]=null;return null;}if(!it.uniq&&bagCount()+1>G.cap)return 'Inventar voll. Erst ein Stück verkaufen.';G.eq[slot]=null;return null;}
function sellItem(it){SLOTS.forEach(s=>{if(G.eq[s]===it.id)G.eq[s]=null;});G.inv=G.inv.filter(i=>i.id!==it.id);G.gold+=sellPrice(it);}

/* ----- Beute ----- */
function rollRar(min){
  const sh=Math.min(10,xpCalc().streak),x=Math.random()*100;
  let r=x<1?3:x<8+0.3*sh?2:x<30+sh?1:0;
  if(G.pity>=14)r=Math.max(r,2);
  r=Math.max(r,min||0);
  if(r>=2)G.pity=0;else G.pity++;
  return r;
}
/* Drei Stücke für verschiedene Plätze. Eins hat die gewürfelte Seltenheit, die beiden anderen meist eine oder zwei Stufen darunter.
   So bleibt die Chance auf das beste Stück unverändert, die Auswahl ist aber gemischt. */
function lowerRar(r){const x=Math.random();return Math.max(0,r-(x<.15?0:x<.75?1:2));}
function itemOptions(rar,pref,src,kind){
  const rs=[rar,lowerRar(rar),lowerRar(rar)];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rs[i],rs[j]]=[rs[j],rs[i]];}
  if(kind==='e')return [mkItem('amulett',rs[0],null),mkItem('ring',rs[1],null),mkItem(Math.random()<.5?'ring':'amulett',rs[2],null)];
  const base=kind==='w'?['main','off','kopf','brust','haende','beine','fuesse','amulett','ring']:['main','off','kopf','brust','haende','beine','fuesse'];
  const pool=[];base.forEach(s=>{const w=pref&&pref.includes(s)?4:1;for(let i=0;i<w;i++)pool.push(s);});
  const slots=[];for(let g=0;g<200&&slots.length<3;g++){const s=pickR(pool);if(!slots.includes(s))slots.push(s);}
  return slots.map((s,i)=>{const arts=Object.keys(ARTS).filter(a=>ARTS[a].slot===s);return mkItem(pickR(arts),rs[i],src);});
}
function queueChest(c){c.id=G.nextId++;G.chests.push(c);G.stats.chests++;}
function lootCount(k,ds){const wk=weekKey(ds);return G.loot.filter(l=>l.k===k&&weekKey(l.date)===wk).length;}
function specialActive(){return !!S.boss.cur||!!S.exam.cur;}
function dungeonBoss(sid){
  const floor=G.floors[sid]+1;let b=G.boss[sid];
  /* Deload und laufende Sonderaufgaben gehen vor: Dann wird ein schon ausgewürfelter Boss neu bestimmt */
  const stale=b&&((S.deload&&b.traits.some(t=>t!=='uralt'&&t!=='hungrig'))||(b.guard&&(specialActive()||S.deload)));
  if(b&&b.floor===floor&&!stale)return b;
  const r=rng(hashStr(sid+':'+floor+':'+G.seed)),D=DUN[sid];
  let guard=floor===G.guard[sid];
  if(guard&&(specialActive()||S.deload)){G.guard[sid]++;guard=false;}
  const x=r();const form=x<0.07?'spiegel':x<0.14?'schlund':D.forms[Math.floor(r()*D.forms.length)];
  const elem=ELEMS[Math.floor(r()*ELEMS.length)].id;
  let pool=TRAITS.map(t=>t.id);
  if(S.deload)pool=['uralt','hungrig'];
  else{if(sid==='A'&&!snapshot().dipsOK)pool=pool.filter(t=>t!=='doppel');if(guard)pool=pool.filter(t=>t!=='hungrig');}
  const t1=pool[Math.floor(r()*pool.length)],traits=[t1];
  if(guard){const rest=pool.filter(t=>t!==t1);traits.push(rest[Math.floor(r()*rest.length)]);}
  b={floor,form,elem,traits,guard};G.boss[sid]=b;saveG();return b;
}
function bossName(b){
  const F=FORMS[b.form],E=ELEMS.find(e=>e.id===b.elem);
  const adj=b.traits.map(id=>TRAITS.find(t=>t.id===id).adj+(F.f?'e':'er')).join(' und ');

}
function bossConds(b){return b.traits.map(id=>TRAITS.find(t=>t.id===id)).filter(t=>t.c);}

/* Einheit abgeschlossen: Stockwerk weiterzählen und Truhe füllen. Höchstens vier Dungeons pro Woche geben Beute. */
function finishDungeon(sid,ds,rooms,cond){
  if(daysBetween(ds,today())>6)return {old:true};
  const b=dungeonBoss(sid),D=DUN[sid],F=FORMS[b.form],conds=bossConds(b);
  const cleared=!b.guard||!!cond,capped=lootCount('d',ds)>=4;
  const res={b,cleared,capped,floor:b.floor,name:bossName(b)};
  if(cleared){G.floors[sid]++;if(b.guard){G.gdone[sid].push(b.floor);G.guard[sid]+=10;}delete G.boss[sid];}
  if(capped){saveG();return res;}
  G.loot.push({k:'d',date:ds,s:sid});
  let gold=rnd(40,60);if(b.traits.includes('hungrig'))gold*=2;
  const mats={};mats[D.mat]=rnd(1,3);if(F.mat)mats['bm_'+b.form]=1;else gold+=40;
  const p=0.35+(rooms?0.10:0)+(cond&&conds.length?0.15:0),sure=G.sure>0||(b.guard&&cleared);
  const c={kind:'d',title:D.short,sub:'Stockwerk '+b.floor+' · '+(b.guard&&!cleared?F.name+' hält stand':F.name+' besiegt'),gold,mats};
  if(sure||Math.random()<p){if(G.sure>0)G.sure--;c.items=itemOptions(rollRar(b.guard&&cleared?1:0),D.slots,b.form,'d');}
  else c.bundles=[{t:'mat',k:D.mat,n:3},{t:'gold',n:30},F.mat?{t:'mat',k:'bm_'+b.form,n:1}:{t:'mat',k:'kristall',n:2}];
  queueChest(c);saveG();return res;
}

function dayCell(ds,month){

  const cell=el(`<button class="cell${Ls.length?' on':(R?' run':'')}${ds===today()?' today':''}" aria-label="${dayName(ds)} ${fmtDate(ds)}">${month?'<i>'+parse(ds).getDate()+'</i>':''}${Ls.length?'<b>'+Ls.map(l=>l.s).join('')+'</b>':''}${R?'<span class="num">'+km(R.km)+' km</span>':''}${boss?'<span>Boss</span>':''}</button>`);
  if(ds>today())cell.disabled=true;
  cell.onclick=()=>daySheet(ds);
  return cell;
}
function daySheet(ds){
  const Ls=S.log.filter(l=>l.date===ds),R=S.runs.find(r=>r.date===ds),St=S.steps.find(q=>q.date===ds);
  const s=el(`<div class="sheet"><div class="inner">
    <h3>${dayName(ds)} ${fmtDate(ds)}</h3>
    <div id="ent"></div>
    <div class="eyebrow" style="margin-top:16px">Einheit für diesen Tag eintragen</div>
    <div class="muted" style="margin-bottom:6px">Nachgetragen zählt die Einheit ohne Bedingung des Bosses. Beute gibt es für die letzten sieben Tage.</div>
    <div class="seg" id="add"></div>
    <button class="btn ghost" id="x">Schließen</button>
  </div></div>`);
  const ent=s.querySelector('#ent');
  if(!Ls.length&&!R&&!St)ent.appendChild(el('<p class="muted" style="margin:6px 0 0">Noch nichts eingetragen.</p>'));
  Ls.forEach(l=>{
    const r=el(`<div class="entry"><span>Einheit ${l.s} · ${esc(sessName(l.s))}${l.note?'<br><span class="muted">'+esc(l.note)+'</span>':''}</span><button class="btn ghost small">Löschen</button></div>`);
    r.querySelector('button').onclick=()=>{S.log.splice(S.log.indexOf(l),1);commit('');daySheet(ds);};ent.appendChild(r);});
  if(R){const r=el(`<div class="entry"><span class="num">Lauf · ${km(R.km)} km in ${fmtTime(R.min)}</span><button class="btn ghost small">Löschen</button></div>`);
    r.querySelector('button').onclick=()=>{S.runs.splice(S.runs.indexOf(R),1);commit('');daySheet(ds);};ent.appendChild(r);}
  if(St)ent.appendChild(el(`<div class="entry"><span class="num">${nf(St.n)} Schritte</span></div>`));
  const add=s.querySelector('#add');
  PLAN.forEach(p=>{const b=el(`<button aria-pressed="false"><b>${p.id}</b><span>${esc(p.name.split(' · ')[1])}</span></button>`);
    b.onclick=()=>{const r=finishDungeon(p.id,ds,false,false);addLog(ds,p.id,'');commit(r.old?'Einheit '+p.id+' nachgetragen':'Einheit '+p.id+' eingetragen');daySheet(ds);};add.appendChild(b);});

}

const NS='http://www.w3.org/2000/svg';
function radar(st){
  const mx=Math.max(20,Math.ceil(Math.max(st.str,st.sta,st.ker,st.aus)/10)*10),cx=160,cy=120,R=68;
  const ax=[['str',0,-1,'Stärke'],['sta',1,0,'Stand'],['ker',0,1,'Kern'],['aus',-1,0,'Ausdauer']];
  let g='';
  [.5,1].forEach(f=>{g+=`<polygon points="${ax.map(a=>(cx+a[1]*R*f)+','+(cy+a[2]*R*f)).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  ax.forEach(a=>{g+=`<line x1="${cx}" y1="${cy}" x2="${cx+a[1]*R}" y2="${cy+a[2]*R}" stroke="var(--line)" stroke-width="1"/>`;});
  g+=`<polygon points="${ax.map(a=>(cx+a[1]*R*st[a[0]]/mx).toFixed(1)+','+(cy+a[2]*R*st[a[0]]/mx).toFixed(1)).join(' ')}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  ax.forEach(a=>{g+=`<circle cx="${(cx+a[1]*R*st[a[0]]/mx).toFixed(1)}" cy="${(cy+a[2]*R*st[a[0]]/mx).toFixed(1)}" r="3.2" fill="var(--accent)"/>`;
    const lx=cx+a[1]*(R+10),ly=cy+a[2]*(R+10);const anchor=a[1]>0?'start':a[1]<0?'end':'middle';
    const y1=a[2]<0?ly-16:a[2]>0?ly+16:ly-3,y2=a[2]<0?ly-3:a[2]>0?ly+30:ly+12;
    g+=`<text x="${lx}" y="${y1}" text-anchor="${anchor}" font-size="18" font-weight="600" fill="var(--fg)" style="font-family:var(--f-disp)">${st[a[0]]}</text>`;
    g+=`<text x="${lx}" y="${y2}" text-anchor="${anchor}" font-size="10.5" letter-spacing="1" fill="var(--fg-dim)" style="font-family:var(--f-disp);text-transform:uppercase">${a[3]}</text>`;});
  return `<svg viewBox="0 0 320 240" style="width:100%;height:auto;max-width:360px;display:block;margin:0 auto" role="img" aria-label="Stats: Stärke ${st.str}, Standfestigkeit ${st.sta}, Kern ${st.ker}, Ausdauer ${st.aus}">${g}</svg>`;
}

function vKalender(){
  const now=new Date();if(!CAL)CAL={y:now.getFullYear(),m:now.getMonth()};
  const first=new Date(CAL.y,CAL.m,1),off=(first.getDay()+6)%7,dim=new Date(CAL.y,CAL.m+1,0).getDate();
  const isCur=CAL.y===now.getFullYear()&&CAL.m===now.getMonth();
  const c1=el(`<section class="card"><div class="calhead"><button class="btn ghost small" id="pv" aria-label="Voriger Monat">‹</button>
    <h2 class="num">${MONTHS[CAL.m]} ${CAL.y}</h2><button class="btn ghost small" id="nx" aria-label="Nächster Monat"${isCur?' disabled style="opacity:.4"':''}>›</button></div>
    <div class="week month" id="mg"></div>
    <div class="stats" style="margin-top:12px" id="ms"></div>
    <div class="hint">Gefüllt sind Trainingstage mit dem Buchstaben der Einheit, umrandet reine Lauftage. Tag antippen zum Nachtragen oder Löschen.</div></section>`);
  const mg=c1.querySelector('#mg');
  for(let k=0;k<7;k++)mg.appendChild(el(`<div class="dn">${DAYS[k]}</div>`));
  for(let k=0;k<off;k++)mg.appendChild(el('<div class="cell out"></div>'));
  const pre=CAL.y+'-'+String(CAL.m+1).padStart(2,'0')+'-';
  for(let d=1;d<=dim;d++)mg.appendChild(dayCell(pre+String(d).padStart(2,'0'),true));
  const ls=S.log.filter(l=>l.date.startsWith(pre)),rs=S.runs.filter(r=>r.date.startsWith(pre));
  const days=new Set([...ls.map(l=>l.date),...rs.map(r=>r.date)]);
  c1.querySelector('#ms').innerHTML=`<div class="stat"><b class="num">${ls.length}</b><span>Einheiten</span></div><div class="stat"><b class="num">${rs.length}</b><span>Läufe</span></div><div class="stat"><b class="num">${days.size}</b><span>aktive Tage</span></div>`;
  c1.querySelector('#pv').onclick=()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--;}render();};
  c1.querySelector('#nx').onclick=()=>{if(isCur)return;CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++;}render();};
  view.appendChild(c1);
}

const MIRROR='translate(200,0) scale(-1,1)';
function bodySVG(spec,label,onPick){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','38 2 124 372');svg.setAttribute('class','body');
  svg.setAttribute('role','img');svg.setAttribute('aria-label','Muskelkarte '+label);
  const mk=(tag,at)=>{const n=document.createElementNS(NS,tag);for(const k in at)n.setAttribute(k,at[k]);return n;};
  svg.appendChild(mk('ellipse',{cx:100,cy:27,rx:15,ry:19,class:'sil'}));
  svg.appendChild(mk('path',{d:SIL,class:'sil'}));
  svg.appendChild(mk('path',{d:SIL,class:'sil',transform:MIRROR}));
  spec.forEach(([mus,d])=>{const h=heat(mus);
    [null,MIRROR].forEach(tr=>{const at={d,class:'m',fill:h===null?'var(--m-base)':HEAT[h],'data-m':mus};if(tr)at.transform=tr;
      const n=mk('path',at);n.addEventListener('click',()=>onPick(mus));svg.appendChild(n);});});
  return svg;
}

function lineChart(points,opts){
  const W=320,H=140,P={l:34,r:8,t:10,b:20};
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('style','width:100%;height:auto');svg.setAttribute('role','img');
  const txt=(x,y,anchor,s)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);
    t.setAttribute('text-anchor',anchor);t.setAttribute('fill','var(--fg-dim)');t.setAttribute('font-size','9');t.textContent=s;svg.appendChild(t);};
  if(points.length<2){txt(W/2,H/2,'middle','Noch zu wenig Daten');return svg;}
  const xs=points.map(p=>parse(p.x).getTime()),ys=points.flatMap(p=>[p.y,p.y2].filter(v=>v!=null));
  const x0=Math.min(...xs),x1=Math.max(...xs);
  let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||1;y0-=pad;y1+=pad;
  const Xf=v=>P.l+(W-P.l-P.r)*((v-x0)/((x1-x0)||1));
  const Yf=v=>P.t+(H-P.t-P.b)*(1-(v-y0)/((y1-y0)||1));
  [y0,(y0+y1)/2,y1].forEach(v=>{const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',P.l);l.setAttribute('x2',W-P.r);l.setAttribute('y1',Yf(v));l.setAttribute('y2',Yf(v));
    l.setAttribute('stroke','var(--line)');l.setAttribute('stroke-width','1');svg.appendChild(l);
    txt(P.l-5,Yf(v)+3.5,'end',opts.fmt?opts.fmt(v):v.toFixed(1).replace('.',','));});
  txt(Xf(xs[0]),H-6,'start',fmtDate(points[0].x));
  txt(Xf(xs[xs.length-1]),H-6,'end',fmtDate(points[points.length-1].x));
  points.forEach(p=>{const ci=document.createElementNS(NS,'circle');
    ci.setAttribute('cx',Xf(parse(p.x).getTime()));ci.setAttribute('cy',Yf(p.y));ci.setAttribute('r','2.2');
    ci.setAttribute('fill','var(--fg-dim)');ci.setAttribute('opacity','.55');svg.appendChild(ci);});
  const d=points.map((p,k)=>(k?'L':'M')+Xf(parse(p.x).getTime()).toFixed(1)+' '+Yf(p.y2).toFixed(1)).join(' ');
  const path=document.createElementNS(NS,'path');path.setAttribute('d',d);path.setAttribute('fill','none');
  path.setAttribute('stroke','var(--accent)');path.setAttribute('stroke-width','2.2');
  path.setAttribute('stroke-linejoin','round');path.setAttribute('stroke-linecap','round');svg.appendChild(path);
  const last=points[points.length-1];
  const ce=document.createElementNS(NS,'circle');ce.setAttribute('cx',Xf(parse(last.x).getTime()));
  ce.setAttribute('cy',Yf(last.y2));ce.setAttribute('r','3.4');ce.setAttribute('fill','var(--accent)');svg.appendChild(ce);
  return svg;
}

/* ================= Karte, Dungeon im Schnitt, Wanderweg =================
   Alles hier ist reine Anzeige: Stockwerke kommen aus dem Spielstand, Schritte und Kilometer aus dem Protokoll. */
const STEP_STAGE=50000,TRAIL_KM=5;
const STAGE_N=['Südtor','Waldrand','Grenzkreuz','Turmhügel','Nordpass','Klippenweg','Küstenblick','Aschefeld'];
const MTAG={A:['Himmelsturm',27,33],B:['Katakomben',24,66],C:['Glutschmiede',79,73],D:['Sturmklippen',85,28]};
const WALKER=['.kkkkk.','.khhhk.','.kssSk.','kkrrrkk','krrrrrk','.krrrk.','.knknk.','.kk.kk.'];
function totalSteps(){return S.steps.reduce((n,x)=>n+(x.n||0),0);}
function totalKm(){return S.runs.reduce((n,r)=>n+(r.km||0),0);}
/* Wanderweg: acht Etappen zu je 50.000 Schritten ergeben eine Runde um die Karte */
function walkInfo(){
  const T=totalSteps(),lapLen=STEP_STAGE*8,inLap=T%lapLen,st=Math.floor(inLap/STEP_STAGE);
  return {T,lap:Math.floor(T/lapLen)+1,st,next:(st+1)%8,left:STEP_STAGE-inLap%STEP_STAGE,fr:inLap/lapLen,part:(inLap%STEP_STAGE)/STEP_STAGE};
}
/* Grenzland: alle 5 km eine Wegmarke, nach zehn Wegmarken steht ein Grenzstein */
function trailInfo(){
  const k=totalKm(),len=TRAIL_KM*10,inTrip=k%len,dots=Math.floor(inTrip/TRAIL_KM+1e-9);
  return {k,stones:Math.floor(k/len+1e-9),dots,left:TRAIL_KM-inTrip%TRAIL_KM,part:(inTrip%TRAIL_KM)/TRAIL_KM};
}
function mapURL(){
  const w=walkInfo(),t=trailInfo(),ri=Math.min(MAP.ring.length-1,Math.floor(w.fr*MAP.ring.length));
  return sprURL('map|'+ri+'|'+w.st+'|'+t.dots,MAP.w,MAP.h,ctx=>{
    paint(ctx,MAP.rows,MAP.pal,0,0);
    MAP.trail.forEach((p,i)=>{if(i<t.dots){ctx.fillStyle='#2a2233';ctx.fillRect(p[0]-1,p[1]-1,4,4);}ctx.fillStyle=i<t.dots?'#6fd3e8':'#8a6a40';ctx.fillRect(p[0],p[1],2,2);});
    MAP.stations.forEach((p,i)=>{ctx.fillStyle='#2a2233';ctx.fillRect(p[0]-2,p[1]-2,5,5);ctx.fillStyle=i<=w.st?'#f2c14e':'#8a6a40';ctx.fillRect(p[0]-1,p[1]-1,3,3);});
    const p=MAP.ring[ri];paint(ctx,WALKER,{},Math.round(p[0])-3,Math.round(p[1])-7);
  });
}

function vVerlauf(){
  const seg=el(`<div class="seg four" style="margin:0"></div>`);
  [['kalender','Kalender'],['karte','Karte'],['koerper','Körper'],['zahlen','Zahlen']].forEach(q=>{

  ({kalender:vKalender,karte:vKarte,koerper:vKoerper,zahlen:vZahlen})[SUB]();
}

    <div class="stats" style="margin-top:10px">
      <div class="stat"><b class="num">${tot}</b><span>Stockwerke</span></div>
      <div class="stat"><b class="num">${nf(w.T)}</b><span>Schritte</span></div>
      <div class="stat"><b class="num">${km(Math.round(t.k*10)/10)}</b><span>km gelaufen</span></div>
    </div>
    <div class="hint">Ort antippen, um den Dungeon im Schnitt zu sehen. Gestrichelt umrandet ist der Vorschlag für heute.</div></section>`);

    b.onclick=()=>dungeonSheet(p.id);mw.appendChild(b);
    const hit=el(`<button class="mhit" style="left:${(100*(MAP.sites[p.id][0]-11)/MAP.w).toFixed(1)}%;top:${(100*(MAP.sites[p.id][1]-24)/MAP.h).toFixed(1)}%" aria-hidden="true" tabindex="-1"></button>`);
    hit.onclick=()=>dungeonSheet(p.id);mw.appendChild(hit);});
  view.appendChild(c);

  const c2=el(`<section class="card"><h2>Dungeons</h2><div id="dl"></div></section>`);
  PLAN.forEach(p=>{const d=lastOf(p.id),D=DUN[p.id];
    const r=el(`<button class="opt"><span><span style="font-weight:600">${esc(D.n)}</span>
      <small class="num">Stockwerk ${G.floors[p.id]} geschafft · Wächter auf ${G.guard[p.id]} · zuletzt ${ago(d?daysBetween(d,today()):null)}</small></span></button>`);
    r.onclick=()=>dungeonSheet(p.id);c2.querySelector('#dl').appendChild(r);});
  view.appendChild(c2);

  const days=S.steps.filter(x=>x.n>=10000).length;
  view.appendChild(el(`<section class="card"><h2>Wanderweg <span class="muted num">Runde ${w.lap}</span></h2>
    <p class="muted" style="margin:0">Alle eingetragenen Schritte ziehen deine Figur über die Ringstraße. Alle ${nf(STEP_STAGE)} Schritte erreichst du eine Etappe, acht Etappen sind eine Runde.</p>
    <div class="trk"><div><b>${STAGE_N[w.st]}</b><span>Etappe ${w.st+1} von 8</span></div><div class="r"><b>${STAGE_N[w.next]}</b><span class="num">noch ${nf(w.left)} Schritte</span></div></div>
    <div class="bar"><i style="width:${Math.max(2,Math.round(100*w.part))}%"></i></div>
    <div class="hint num">${nf(w.T)} Schritte insgesamt · ${days} ${days===1?'Tag':'Tage'} mit 10.000 und mehr. XP und Meilensteine gibt es weiter nur für diese Tage.</div></section>`));
  view.appendChild(el(`<section class="card"><h2>Grenzland <span class="muted num">${t.stones} ${t.stones===1?'Grenzstein':'Grenzsteine'}</span></h2>
    <p class="muted" style="margin:0">Jeder Lauf führt weiter nach Westen. Alle ${TRAIL_KM} km leuchtet eine Wegmarke auf, nach zehn Wegmarken setzt du einen Grenzstein und der Pfad beginnt tiefer im Grenzland neu.</p>
    <div class="trk"><div><b>Wegmarke ${t.dots} von 10</b><span class="num">${km(Math.round(t.k*10)/10)} km insgesamt</span></div><div class="r"><b>Wegmarke ${t.dots+1}</b><span class="num">noch ${km(Math.round(t.left*10)/10)} km</span></div></div>
    <div class="bar"><i style="width:${Math.max(2,Math.round(100*t.part))}%"></i></div></section>`));
}

/* ---------- Dungeon im Schnitt ---------- */
const SECT={
 A:{up:true,bg:'#8ec5e8',sp:['#b9dcf2','#f4f8fb'],wall:'#c9d1dc',wallS:'#8f99aa',slab:'#8f99aa',slabL:'#d5dbe4',lit:'#6b5645',cur:'#806a52',dark:'#2a2433',win:'#f2c14e',end:'#5a9444'},
 D:{up:true,bg:'#4a5a78',sp:['#5c6d8c','#3d4a66'],wall:'#8d97a6',wallS:'#5e6775',slab:'#5e6775',slabL:'#a9b3c2',lit:'#4f4a5e',cur:'#625c74',dark:'#211e2b',win:null,end:'#34689c'},
 B:{up:false,bg:'#6b4a2e',sp:['#5e3b20','#8a6a40'],wall:'#4a321f',wallS:'#33220f',slab:'#33220f',slabL:'#6b4a2e',lit:'#5a4632',cur:'#6e5740',dark:'#1e1712',win:null,end:'#5a9444'},
 C:{up:false,bg:'#3a3144',sp:['#2f2a3a','#d9512c'],wall:'#2a2233',wallS:'#1a1420',slab:'#5a4d5e',slabL:'#7a6c80',lit:'#5e3a34',cur:'#784840',dark:'#1a1420',win:null,end:'#5a4d5e'}};
const SEC={w:144,rows:7,fh:28,top:12,bot:10,x0:30,x1:114};
function sectionRange(sid){const cur=G.floors[sid]+1,hi=Math.max(SEC.rows,cur+2);return {cur,hi,lo:hi-SEC.rows+1};}
function sectionURL(sid){
  const P=SECT[sid],R=sectionRange(sid),b=dungeonBoss(sid),H=SEC.top+SEC.rows*SEC.fh+SEC.bot,W=SEC.w,x0=SEC.x0,x1=SEC.x1;
  const key='sec|'+sid+'|'+R.cur+'|'+G.guard[sid]+'|'+G.gdone[sid].join('.')+'|'+b.form+b.elem+(b.guard?1:0)+'|'+heroKey();
  return sprURL(key,W,H,ctx=>{
    const fill=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
    fill(P.bg,0,0,W,H);
    const r0=rng(hashStr('bg'+sid+R.lo));
    for(let i=0;i<90;i++){const x=Math.floor(r0()*W),y=Math.floor(r0()*H),k=r0();
      if(sid==='A'){if(k<.12)fill(P.sp[1],x,y,9+Math.floor(k*60),3);}
      else if(sid==='D'){fill(P.sp[k<.5?0:1],x,y,1,3);}
      else if(sid==='C'){fill(P.sp[k<.85?0:1],x,y,k<.85?3:2,k<.85?2:1);}
      else fill(P.sp[k<.6?0:1],x,y,k<.6?3:2,k<.6?2:1);}
    /* Schacht über die ganze Höhe, damit er an den Rändern weiterzulaufen scheint */
    fill(P.wall,x0,0,x1-x0,H);fill(P.dark,x0+5,0,x1-x0-10,H);
    fill(P.wallS,x0+4,0,1,H);fill(P.wallS,x1-5,0,1,H);
    for(let y=3;y<H;y+=6){fill(P.wallS,x0,y,4,1);fill(P.wallS,x1-4,y,4,1);}
    for(let r=0;r<SEC.rows;r++){
      const f=P.up?R.hi-r:R.lo+r,y=SEC.top+r*SEC.fh,done=f<R.cur,cur=f===R.cur,ih=SEC.fh-6;
      fill(done?P.lit:cur?P.cur:P.dark,x0+5,y,x1-x0-10,ih);
      fill(P.slab,x0,y+ih,x1-x0,6);fill(P.slabL,x0,y+ih,x1-x0,1);
      if(done||cur){
        const lx=f%2?x0+9:x1-15;                                   /* Leiter */
        fill('#8a6a40',lx,y,1,ih);fill('#8a6a40',lx+5,y,1,ih);for(let k=2;k<ih;k+=4)fill('#b08a5a',lx,y+k,6,1);
        [x0+24,x1-25].forEach(tx=>{fill('#5e3b20',tx,y+7,1,4);fill('#d9512c',tx-1,y+4,3,3);fill('#f2c14e',tx,y+5,1,2);});   /* Fackeln */
        if(P.win&&done){fill(P.win,x0+1,y+6,2,5);fill(P.win,x1-3,y+6,2,5);}
      }
      if(done){
        const g=G.gdone[sid].includes(f),bx=Math.floor((x0+x1)/2)-3,by=y+ih-13;   /* Banner: grün geschafft, gold für gefallene Wächter */
        fill('#3b2a1e',bx,by,1,13);fill(g?'#f2c14e':'#58a653',bx+1,by,6,5);fill(g?'#c2902c':'#356b33',bx+1,by+4,6,1);
        if(g){fill('#3b2a1e',bx+3,by+1,2,2);}
      }
      if(cur){
        heroPaint(ctx,x0+26,y);
        const F=FORMS[b.form],E=ELEMS.find(e=>e.id===b.elem);paint(ctx,SP[F.spr],E.p,x1-44,y+ih-16);
      }
      if(!done&&!cur&&f===G.guard[sid]){
        const bx=Math.floor((x0+x1)/2)-5,by=y+4;                    /* Wächter-Tor */
        fill('#8a2a1f',bx,by,11,ih-4);fill('#b83a2c',bx+1,by+1,9,ih-6);
        fill('#f3e7c9',bx+3,by+4,5,4);fill('#f3e7c9',bx+4,by+8,3,2);fill('#2a2233',bx+4,by+5,1,2);fill('#2a2233',bx+6,by+5,1,2);
      }
    }
    /* Anfang des Dungeons: Boden unter dem Turm, Erdoberfläche über den Katakomben */
    if(R.lo===1){
      if(P.up){fill(P.end,0,H-SEC.bot+2,W,SEC.bot-2);}
      else{fill(sid==='B'?'#8ec5e8':'#4a3f5a',0,0,W,SEC.top-4);fill(P.end,0,SEC.top-4,W,4);fill(P.dark,Math.floor((x0+x1)/2)-6,SEC.top-4,12,4);}
    }
  });
}
function dungeonSheet(sid){
  const D=DUN[sid],P=SECT[sid],R=sectionRange(sid),b=dungeonBoss(sid),conds=bossConds(b),H=SEC.top+SEC.rows*SEC.fh+SEC.bot;
  let lab='';
  for(let r=0;r<SEC.rows;r++){const f=P.up?R.hi-r:R.lo+r,top=(100*(SEC.top+r*SEC.fh+7)/H).toFixed(2);
    lab+=`<span class="fl${f===R.cur?' cur':f<R.cur?' ok':''}" style="top:${top}%">${f}</span>`;
    if(f===R.cur)lab+=`<span class="fr cur" style="top:${top}%">${b.guard?'Wächter':'Du'}</span>`;
    else if(f>R.cur&&f===G.guard[sid])lab+=`<span class="fr" style="top:${top}%">Wächter</span>`;}
  const s=el(`<div class="sheet"><div class="inner">
    <h3>${esc(D.n)}</h3>
    <p class="muted num" style="margin:0 0 10px">${G.floors[sid]} ${G.floors[sid]===1?'Stockwerk':'Stockwerke'} geschafft · nächster Wächter auf ${G.guard[sid]} · ${P.up?'es geht nach oben':'es geht nach unten'}</p>
    <div class="secwrap"><img class="px" src="${sectionURL(sid)}" width="${SEC.w}" height="${H}" alt="Schnitt durch ${esc(D.n)}: Stockwerke ${R.lo} bis ${R.hi}, du stehst auf ${R.cur}">${lab}</div>
    <div class="hint" style="margin-top:10px"><b style="color:var(--fg)">Stockwerk ${R.cur}:</b> ${esc(bossName(b))}${conds.length?'. '+conds.map(t=>esc(t.c)).join(' '):''}</div>
    <button class="btn" id="goD">Hier antreten</button>
    <button class="btn ghost" id="x">Schließen</button></div></div>`);
  s.querySelector('#goD').onclick=()=>{host.innerHTML='';SEL=sid;CK={rooms:null,cond:false};go('heute');};
  s.onclick=ev=>{if(ev.target===s||ev.target.id==='x')host.innerHTML='';};
  host.innerHTML='';host.appendChild(s);
}

tick();startGame();gameTick();save();saveG();

if(levelOf(LASTXP)>S.seenLvl){S.seenLvl=levelOf(LASTXP);save();}
render();
if(G.chests.some(c=>c.kind==='start'))openChest();
let RDAY=today();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;drawTimer();
  if(today()!==RDAY){RDAY=today();tick();gameTick();save();saveG();render();}});
if(HOSTED&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
